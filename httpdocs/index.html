<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- nunki:social -->
<meta name="description" content="Wanden — getekend, scrollend, levend.">
<link rel="canonical" href="https://nunkichannels.nl/">
<meta property="og:site_name" content="nunkichannels">
<meta property="og:title" content="nunkichannels">
<meta property="og:description" content="Wanden — getekend, scrollend, levend.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nunkichannels.nl/">
<meta property="og:image" content="https://nunkichannels.nl/images/og/index.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="nunkichannels — Wanden — getekend, scrollend, levend.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="nunkichannels">
<meta name="twitter:description" content="Wanden — getekend, scrollend, levend.">
<meta name="twitter:image" content="https://nunkichannels.nl/images/og/index.jpg">
<meta name="twitter:image:alt" content="nunkichannels — Wanden — getekend, scrollend, levend.">
<!-- /nunki:social -->
<title>nunkichannels</title>
<style>
  :root {
    --bg: #0c0e14;
    --card: #141820;
    --text: #f6f1e4;
    --muted: #9a9488;
    --line: rgba(246, 241, 228, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, sans-serif;
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }
  header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0 0 0.35rem;
    font-size: clamp(1.75rem, 4vw, 2.35rem);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .lead {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 36em;
    line-height: 1.5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: 1.25rem;
  }
  .card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: rgba(246, 241, 228, 0.22);
    transform: translateY(-2px);
    outline: none;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1200 / 630;
    object-fit: cover;
    display: block;
    background: #1a1712;
  }
  .card-body {
    padding: 1rem 1.1rem 1.15rem;
  }
  .card h2 {
    margin: 0 0 0.35rem;
    font-size: 1.25rem;
    font-weight: 600;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .empty, .err {
    color: var(--muted);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>nunkichannels</h1>
    <p class="lead" id="site-lead">Wanden — getekend, scrollend, levend.</p>
  </header>
  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="status" hidden>Laden…</p>
</div>
<script>
(async function () {
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const lead = document.getElementById('site-lead');
  status.hidden = false;
  try {
    const res = await fetch('./pages.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('pages.json ontbreekt');
    const data = await res.json();
    if (data.site?.name) document.title = data.site.name;
    status.hidden = true;
    const pages = (data.pages || []).slice().sort((a, b) =>
      a.title.localeCompare(b.title, 'nl'));
    if (!pages.length) {
      status.textContent = 'Nog geen kanalen.';
      status.hidden = false;
      return;
    }
    for (const p of pages) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = p.path || ('/' + p.slug + '/');
      const img = document.createElement('img');
      img.src = p.ogImage || '';
      img.alt = p.title + (p.subtitle ? ' — ' + p.subtitle : '');
      img.loading = 'lazy';
      img.width = 1200;
      img.height = 630;
      const body = document.createElement('div');
      body.className = 'card-body';
      const h2 = document.createElement('h2');
      h2.textContent = p.title;
      const sub = document.createElement('p');
      sub.textContent = p.subtitle || '';
      body.append(h2, sub);
      a.append(img, body);
      grid.appendChild(a);
    }
  } catch (e) {
    status.className = 'err';
    status.textContent = 'Kon pages.json niet laden. Voer scripts/build.py uit.';
    status.hidden = false;
  }
})();
</script>
</body>
</html>
