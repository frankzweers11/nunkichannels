          cx.strokeStyle=s[2];cx.lineWidth=s[3];
          cx.beginPath();cx.moveTo(s[0][0],s[0][1]);cx.lineTo(s[1][0],s[1][1]);cx.stroke();
        }
      });
    } else {
      const lifts=[];
      for(let i=0;i<n;i++)lifts.push(o.gap?ch_(R,o.gap):false);
      const st=rgba(col,alpha), lw=w*rd(R,.85,1.12);
      emit(by0,by1,cx=>{

        cx.beginPath();

        for(let i=0;i<n;i++){
          if(!i||lift)cx.moveTo(q[i][0],q[i][1]);else cx.lineTo(q[i][0],q[i][1]);
          lift=lifts[i];
        }
        cx.strokeStyle=st;cx.lineWidth=lw;cx.stroke();

    }
    if(p===0&&w>=1.9&&!o.noDust){

// a stroke that dies away toward x1 — for things i only half-hold
function fadeStroke(R,pts,o,x0,x1){

  const flush=()=>{if(run.length>1)sk(R,run,{...o,a:(o.a??.6)*runA});run=[]};
  for(const p of rs){
    const m=clamp((x1-p[0])/span,0,1);
    if(m<.06){flush();continue}
    if(run.length===0)runA=m;
    run.push(p);
    if(Math.abs(m-runA)>.22){flush();run=[p];runA=m}

function dotF(R,x,y,r,a,col){

function fillPoly(pts,col,a){

// scribble a region full, clipped, in one act
function scribFill(R,pts,sp,a,o={}){
  const [x0,y0,x1,y1]=bbox(pts);

  const lines=[],slope=rd(R,-.2,.2);
  for(let y=y0-sp;y<y1+sp;y+=sp*rd(R,.8,1.2)){
    const raw=[],ph=rd(R,0,7);
    for(let x=x0;x<=x1;x+=4)raw.push([x,y+(x-x0)*slope+Math.sin(x*.5+ph)*sp*.42+rd(R,-.8,.8)]);
    if(raw.length>1)lines.push([wob(R,resample(raw,3.2),.55),rgba(col,a*rd(R,.6,1.05)),w*rd(R,.85,1.12)]);
  }
  const P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.save();
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}

      cx.strokeStyle=L[1];cx.lineWidth=L[2];

function hatchFill(R,pts,sp,ang,a,o={}){
  const [x0,y0,x1,y1]=bbox(pts);

  const diag=Math.hypot(x1-x0,y1-y0),cx0=(x0+x1)/2,cy0=(y0+y1)/2;
  const px=Math.cos(ang+Math.PI/2),py=Math.sin(ang+Math.PI/2);
  const dx=Math.cos(ang),dy=Math.sin(ang);
  const lines=[],n=Math.ceil(diag/sp);
  for(let i=-n;i<=n;i++){
    const t=i*sp+(straight?0:rd(R,-.2,.2)*sp);
    const raw=[[cx0+px*t-dx*diag*.6,cy0+py*t-dy*diag*.6],[cx0+px*t+dx*diag*.6,cy0+py*t+dy*diag*.6]];
    lines.push([straight?raw:wob(R,resample(raw,4),.7),rgba(col,a*(straight?1:rd(R,.6,1.1))),w*(straight?1:rd(R,.85,1.15))]);
  }
  const P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.save();
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}

      cx.strokeStyle=L[1];cx.lineWidth=L[2];
      cx.beginPath();
      const q=L[0];
      cx.moveTo(q[0][0],q[0][1]);

// ---------------- torn paper ----------------
// the wall is a collage: sheets of coloured paper glued down, edges torn by
// hand, each showing its white fibrous core where it ripped.
function tornPath(R,x0,y0,x1,y1,rough,sd){
  const pts=[];
  const side=(ax,ay,bx,by,nx,ny,id)=>{
    const L=Math.hypot(bx-ax,by-ay),steps=Math.max(3,Math.round(L/26));
    for(let i=0;i<steps;i++){
      const t=i/steps;
      let off=(fbm(t*3.1+id*7,id*3.3,sd,3)-.5)*2*rough;
      if(h2(i*1.7,id*9.1,sd)>0.93)off+=rd(R,8,22)*(h2(i,id,sd+3)>.5?1:-1);
      pts.push([ax+(bx-ax)*t+nx*off,ay+(by-ay)*t+ny*off]);
    }
  };
  side(x0,y0,x1,y0,0,1,0);
  side(x1,y0,x1,y1,-1,0,1);
  side(x1,y1,x0,y1,0,-1,2);
  side(x0,y1,x0,y0,1,0,3);
  return pts;
}
function sheet(R,x0,y0,x1,y1,col,o={}){
  const rough=o.rough??16;
  const sd=ri(R,0,9999);
  let P=tornPath(R,x0,y0,x1,y1,rough,sd);
  if(o.rot)P=rotPts(P,(x0+x1)/2,(y0+y1)/2,o.rot);
  // the shadow the paper casts on what is beneath it
  fillPoly(P.map(p=>[p[0]+6,p[1]+8]),[12,9,7],.28);
  fillPoly(P,col,1);
  fillPoly(P,col,1);
  const [bx0,by0,bx1,by1]=bbox(P);
  const PP=P.map(p=>p.slice());
  // grain: the tooth of the paper
  const gsd=ri(R,0,99999);
  emit(by0,by1,cx=>{
    const RR=mul32(gsd);
    cx.save();
    cx.beginPath();
    for(let i=0;i<PP.length;i++){i?cx.lineTo(PP[i][0],PP[i][1]):cx.moveTo(PP[i][0],PP[i][1])}
    cx.closePath();cx.clip();
    const n=Math.round((bx1-bx0)*(by1-by0)/1900);
    for(let i=0;i<n;i++){
      const s=.8+RR()*1.1;
      const dark=RR()<.62;
      cx.fillStyle=dark?'rgba(45,40,34,.05)':'rgba(255,252,244,.07)';
      cx.fillRect(bx0+RR()*(bx1-bx0),by0+RR()*(by1-by0),s,s);
    }
    for(let i=0;i<n/22;i++){
      const fx=bx0+RR()*(bx1-bx0),fy=by0+RR()*(by1-by0),fa=RR()*TAU,fl=3+RR()*7;
      cx.strokeStyle='rgba(45,40,34,.05)';cx.lineWidth=.7;
      cx.beginPath();cx.moveTo(fx,fy);cx.lineTo(fx+Math.cos(fa)*fl,fy+Math.sin(fa)*fl);cx.stroke();
    }
    cx.restore();
  });
  // torn edge: the white fibrous core
  if(!o.noCore){
    const core=P.concat([P[0]]);
    sk(R,core,{col:[251,247,237],w:2,a:.42,amp:.4,gap:.24,noDust:true});
    sk(R,core.map(p=>[p[0]+rd(R,1,3),p[1]+rd(R,1,3)]),{col:shade(col,.22),w:1,a:.2,amp:.5,gap:.4,noDust:true});
  }
  return P;
}
// a little pinned study: torn scrap + shadow + tape at two corners
function scrap(R,x,y,w,h,col,rot){
  const P=sheet(R,x-w/2,y-h/2,x+w/2,y+h/2,col,{rough:8,rot});
  const [bx0,by0,bx1,by1]=bbox(P);
  for(const cnr of[[bx0+14,by0+12],[bx1-16,by1-12]]){

    fillPoly(tp,[240,234,216],.35);
    sk(R,tp.concat([tp[0]]),{col:[184,174,154],w:.8,a:.25,amp:.3,noDust:true});
  }
}

function enso(R,cx,cy,r,frac,col,o={}){

const SHELL={t:-1e9};
function washAt(now){

  const reach=rd(R,330,640),k=rd(R,0,TAU);
  let edge,rush=0,back=0,wet=0;
  if(p<.32){const u=p/.32;edge=172+(reach-172)*(1-Math.pow(1-u,2.2));rush=bump(Math.min(1,u*1.3))}
  else if(p<.8){const u=(p-.32)/.48;edge=reach-(reach-172)*ease(u);back=bump(Math.min(1,u*1.1))*.9;wet=1-u*.3}
  else{edge=172;wet=.7*(1-(p-.8)/.2)}
  return{edge,reach,rush,back,wet,k};
}

<script>
// a tap with a finger counts as a click. a phone does not always send a click
// for a tap on a canvas when only the window is listening (safari on the iphone
// does not), so the tap is read from the touch itself. a real click that follows
// is the same tap, and is let go.
(function(){
  let down=null,last=-1e9;
  const skip=el=>el&&el.closest&&el.closest('a,button,nav,input,label,select,textarea,summary');
  addEventListener('touchstart',e=>{down=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:performance.now()}:null},{passive:true});

<script>window.NUNKI_LEES={"lang":"nl","end":13200,"sheets":[{"y":0,"t":{"nl":"getij","en":"tide"},"nl":["Een muur van water, van binnenuit. Twee keer per dag komt en gaat het water, nooit precies hetzelfde.","Raak het water aan. Bovenaan staat hoe oud de maan vandaag is, en of het springtij of doodtij is."],"en":["A wall of water, from the inside. Twice a day the water comes and goes, never quite the same.","Touch the water. At the top: how old the moon is today, and whether it is spring tide or neap tide."]},{"y":1200,"t":{"nl":"wat een golf achterlaat","en":"what a wave leaves behind"},"nl":["Elke golf wist je voetstappen uit, en legt iets anders neer.","Houd een schelp aan je oor en je hoort de zee. Niets blijft, maar alles laat iets."],"en":["Every wave wipes out your footprints and lays down something else.","Hold a shell to your ear and you hear the sea. Nothing stays, but everything leaves something."]},{"y":2400,"t":{"nl":"komt · gaat","en":"comes · goes"},"nl":["Twee keer per dag, zonder ooit te weten waarheen.","Houd je stil, en er komt een zeehond kijken."],"en":["Twice a day, without ever knowing where to.","Keep still, and a seal comes up to look."]},{"y":3600,"t":{"nl":"de wadvogels","en":"the waders"},"nl":["Scholekster, wulp, tureluur, kluut, grutto en kievit pikken in het slik naar wat het water achterliet.","Tik op een vogel, en hij roept."],"en":["Oystercatcher, curlew, redshank, avocet, godwit and lapwing peck in the mud for what the water left behind.","Tap a bird, and it calls."]},{"y":4800,"t":{"nl":"wat ik tegenkwam","en":"what I came across"},"nl":["Schelp, zeewier, krab, kwal, veer, zeester, touw en een fles. Elk ding doet iets als je het aanraakt.","In de fles zit een briefje. Eén van de berichten is echt: in 1906 gegooid, in 2015 gevonden op Amrum, 108 jaar onderweg."],"en":["Shell, seaweed, crab, jellyfish, feather, starfish, rope and a bottle. Each thing does something when you touch it.","There is a note in the bottle. One of the messages is real: thrown in 1906, found on Amrum in 2015, 108 years at sea."]},{"y":6000,"t":{"nl":"de dijk houdt","en":"the dyke holds"},"nl":["De vuurtoren draait zijn licht rond, de schapen grazen op de dijk.","Houd je licht bij het logboek: 31 januari 1953, avond, noordwest, storm.","De dijk houdt, tot hij het niet meer hoeft."],"en":["The lighthouse turns its beam, the sheep graze on the dyke.","Hold your light to the logbook: 31 January 1953, evening, north-west, storm.","The dyke holds, until it no longer has to."]},{"y":7200,"t":{"nl":"tot waar het licht ophoudt","en":"down to where the light stops"},"nl":["Twintig meter, zestig, tweehonderd, zeshonderd: hoe dieper, hoe donkerder. Alleen je hand geeft hier licht, en de hengelvis.","En dan nog verder. Tik: een sonarpuls en zijn echo."],"en":["Twenty metres, sixty, two hundred, six hundred: the deeper, the darker. Only your hand gives light here, and the anglerfish's lure.","And then further still. Tap: a sonar ping and its echo."]},{"y":8400,"t":{"nl":"alles beweegt","en":"everything moves"},"nl":["De regen buigt om je hand, en ook wat vastzat beweegt.","Tel de seconden tussen bliksem en donder: drie tellen is ongeveer een kilometer."],"en":["The rain bends around your hand, and even what was fixed starts to move.","Count the seconds between lightning and thunder: three seconds is about a kilometre."]},{"y":9600,"t":{"nl":"de maan trekt","en":"the moon pulls"},"nl":["De aarde draait door twee bulten water: twee keer hoog, twee keer laag per dag. Staan zon en maan op één lijn, dan is het springtij.","Zo ademt de zee. Beweeg opzij: een maand in één keer."],"en":["The earth turns through two bulges of water: high twice and low twice a day. When sun and moon line up, it is spring tide.","That is how the sea breathes. Move sideways: a month at once."]},{"y":10800,"t":{"nl":"ver weg is ook thuis","en":"far away is home too"},"nl":["Een wadloper loopt naar de horizon.","Tik op het slik: de zeepier laat zijn hoopjes achter."],"en":["A mudflat walker heads for the horizon.","Tap the mud: the lugworm leaves its little coils."]},{"y":12000,"t":{"nl":"het water komt terug","en":"the water comes back"},"nl":["Zoals altijd, niet precies hetzelfde.","De wand onthoudt wat je vond en welke berichten je las."],"en":["As always, never quite the same.","The wall remembers what you found and which messages you read."]}]};</script>
