//
// there are no cards: the wall itself is one long sheet that goes from night
// to day as you scroll, and the scenes are drawn straight onto it.
// one braided line of force (the spine) runs the whole way down. it leaves a
// magnet in the dark, turns into light, rides through a galaxy, a solar storm
// and an aurora, passes birds, a thought, a heart and a strand of dna, runs
// through the one who looks, and with the first light of morning comes down to
// the masts on the horizon and, below them, to the flower in the grass where a
// bee is flying. each scene carries one sentence or one question: a sentence
// is something known, a question is something open.

const VIS=[[214,60,56],[232,120,50],[226,176,40],[96,170,84],[64,150,196],[80,100,200],[140,84,190]];

const P=[];
// one extra glyph for the questions
G('?',.5,[[.08,.2],[.2,.1],[.38,.14],[.42,.34],[.26,.58],[.24,.72]],[[.24,.94],[.27,.98]]);

// ---------------- the wall: night that turns into day ----------------
// the colour of the sheet in each of the dark scenes; they run into each other around every seam
const NIGHT=[[14,12,30],[14,14,34],[16,13,34],[24,12,22],[8,13,26],[22,26,62],[14,15,36],[30,12,28],[22,17,42],[12,14,28]];
const SEAMW=[110,110,140,140,150,150,130,130,140];
// then the morning: the sky goes from the dark of the last scene to the light of
// the day, down to the horizon, and under the horizon the ground begins
const HZ=12900;
const MEAD=[212,225,174];
const DAWN=[[11700,NIGHT[9]],[11900,[32,36,90]],[12060,[96,84,152]],[12220,[206,136,152]],[12360,[246,200,160]],[12500,[222,232,238]],[HZ-16,[248,240,222]],[HZ+10,[214,226,176]],[13250,MEAD],[13900,[222,226,180]],[14400,[230,224,188]],[14700,[234,226,192]]];
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function bgAt(y){
  if(y<11700){
    for(let i=0;i<9;i++){
      const b=(i+1)*PH,w=SEAMW[i];
      if(y<b-w)return NIGHT[i];
      if(y<=b+w)return mix(NIGHT[i],NIGHT[i+1],sm((y-(b-w))/(2*w)));
    }
    return NIGHT[9];
  }
  for(let i=1;i<DAWN.length;i++){
    if(y<=DAWN[i][0]){const a=DAWN[i-1],b=DAWN[i];return mix(a[1],b[1],(y-a[0])/(b[0]-a[0]))}
  }
  return DAWN[DAWN.length-1][1];
}
const lumOf=c=>(.299*c[0]+.587*c[1]+.114*c[2])/255;
function lumAt(y){return lumOf(bgAt(y))}
// the sheet itself, laid down in strips, with the tooth of the paper over it
function wallPaint(R){
  const st=30;
  for(let y=-10;y<TOTALH;y+=st){
    const c0=bgAt(y),c1=bgAt(y+st),ya=y;
    emit(ya-2,ya+st+2,c=>{
      const g=c.createLinearGradient(0,ya,0,ya+st);
      g.addColorStop(0,rgba(c0,1));g.addColorStop(1,rgba(c1,1));
      c.fillStyle=g;c.fillRect(-10,ya-1,LW+20,st+2.5);
    });
  }
  for(let y0=-10;y0<TOTALH;y0+=400){
    const gsd=ri(R,0,99999),y1=Math.min(TOTALH,y0+400);
    emit(y0,y1,c=>{
      const RR=mul32(gsd),n=Math.round(LW*(y1-y0)/1900);
      for(let i=0;i<n;i++){
        const s=.8+RR()*1.1,x=RR()*LW,y=y0+RR()*(y1-y0),lt=lumAt(y)>.5;
        // on the dark sheet the tooth is a little lighter, on the light sheet a little darker
        c.fillStyle=lt?(RR()<.62?'rgba(45,40,34,.05)':'rgba(255,252,244,.07)'):(RR()<.55?'rgba(255,250,240,.035)':'rgba(0,0,0,.08)');
        c.fillRect(x,y,s,s);
      }
      for(let i=0;i<n/22;i++){
        const fx=RR()*LW,fy=y0+RR()*(y1-y0),fa=RR()*TAU,fl=3+RR()*7;
        c.strokeStyle=lumAt(fy)>.5?'rgba(45,40,34,.05)':'rgba(255,250,240,.04)';c.lineWidth=.7;
        c.beginPath();c.moveTo(fx,fy);c.lineTo(fx+Math.cos(fa)*fl,fy+Math.sin(fa)*fl);c.stroke();
      }
    });
  }
}
// the morning is shaded by hand: loose pencil strokes across the sky, thickest
// where the night is turning into colour, thinning out toward the light
function shadeDawn(R){
  const ya=11640,yb=12520,cr=[[11700,[120,108,200]],[11950,[150,122,206]],[12150,[232,150,160]],[12320,[252,204,156]],[12500,[252,232,200]]];
  const n=Math.round((yb-ya)*1.7);
  for(let k=0;k<n;k++){
    const u=R(),y=ya+u*(yb-ya),p=Math.sin(clamp(u,0,1)*Math.PI);
    if(R()>p*.95+.04)continue;
    const len=rd(R,260,860),x=rd(R,-140,LW-len+140),sl=rd(R,-.03,.03),pts=[];
    for(let xx=x;xx<=x+len;xx+=14)pts.push([xx,y+(xx-x)*sl+Math.sin(xx*.004+k)*4]);
    sk(R,pts,{col:ramp(cr,y),w:rd(R,1,2.2),a:rd(R,.07,.17)*(.4+p*.8),amp:.9,noDust:true,gap:.03});
  }
  for(let k=0;k<(yb-ya)*.5;k++){
    const u=R(),y=ya+u*(yb-ya),p=Math.sin(clamp(u,0,1)*Math.PI);
    if(R()>p*p*.6)continue;
    const x=rd(R,-20,LW+20),an=rd(R,.75,1.25)*(R()<.5?1:-1),len=rd(R,30,110);
    sk(R,[[x,y],[x+Math.cos(an)*len,y+Math.sin(an)*len]],{col:ramp(cr,y),w:rd(R,.9,1.6),a:rd(R,.06,.14),amp:.6,noDust:true,taper:'both'});
  }
}
// the night sky is one sky: stars wherever the sheet is dark
function starfield(R){
  const spec=[[0,250,-90,1290],[1,230,-90,1290],[2,470,-90,1290],[3,320,-90,1290],[4,430,-90,800],[5,300,-90,1290],[6,300,-90,1290],[7,260,-90,1290],[8,300,-90,1290],[9,420,-90,1500]];
  const out=[];
  for(const [pn,n,a,b] of spec){
    for(let i=0;i<n;i++){
      const y=pn*PH+rd(R,a,b),x=rd(R,10,1590),dk=clamp((.5-lumAt(y))/.3,0,1);
      if(R()>dk)continue;
      out.push([x,y,rd(R,.5,1.6),rd(R,.1,.55)*dk]);
    }
  }
  out.sort((p,q)=>p[1]-q[1]);
  dustBatch(out,CINK);
}

// ---------------- the journey: colour and the spine ----------------
const JC=[[0,ELEC],[1,[120,110,225]],[2.1,[170,100,215]],[3.2,[255,170,70]],[4.2,AUR_G],[5.2,[120,170,240]],
  [6.2,AUR_V],[7.2,[232,92,122]],[8.2,[90,150,214]],[9.3,[240,196,120]],[10.3,[104,122,214]],[11.2,[232,120,150]],[12,[240,176,70]]];
function ramp(st,t){
  if(t<=st[0][0])return st[0][1];
  for(let i=1;i<st.length;i++)if(t<=st[i][0]){const a=st[i-1],b=st[i];return mix(a[1],b[1],(t-a[0])/((b[0]-a[0])||1))}
  return st[st.length-1][1];
}
// waypoints of the spine in wall coordinates: it zigzags so each scene keeps
// one bottom corner free for its sentence
const SMID=[0,820,780,850,800,760,900,800,840,820,800,820];
const SWX={1:[[560,1330],[800,1330]],9:[[110,1000],[290,905],[408,872]],11:[[200,1010],[340,1004]]};
const SW=[[700,950],[800,1012]];
for(let i=0;i<12;i++){
  if(i>0)for(const m of(SWX[i]||[[600,SMID[i]]]))SW.push([i*PH+m[0],m[1]]);
  // the line ends in the bee, so the last scene has no way out
  if(i<11)SW.push([i*PH+1150,i%2===0?940:640]);
}
function spineX(gy){
  let i=0;
  while(i<SW.length-2&&SW[i+1][0]<gy)i++;
  const [ya,xa]=SW[i],[yb,xb]=SW[i+1];
  let t=clamp((gy-ya)/(yb-ya||1),0,1);
  t=t*t*(3-2*t);
  return xa+(xb-xa)*t+Math.sin(gy*.0047+1)*10;
}
const SPEND=392;
// five strands, braided. on dark paper they glow, on light paper they are pencil
function spine(R,pi,y0,y1){
  const base=pi*PH,N=5,old=COMP;
  for(let k=0;k<N;k++){
    let y=y0;
    while(y<y1){
      const y2=Math.min(y1,y+rd(R,240,380)),pts=[];
      for(let yy=y;yy<=y2;yy+=11){
        const gy=yy+base;
        let off=(k-2)*(5+4*Math.sin(gy*.0021+k))+11*Math.sin(gy*(.0062+.0009*k)+k*1.3);
        // the lines fan out from the pole, come together in the one who looks and open up again,
        // and gather once more in the bee
        if(pi===0)off*=clamp((yy-700)/150,0,1);
        if(pi===9)off*=clamp(Math.abs(yy-408)/210,.04,1);
        if(pi===11)off*=clamp((SPEND-yy)/200,.04,1);
        pts.push([spineX(gy)+off,yy]);
      }
      if(pts.length>1){
        const dark=lumAt(base+(y+y2)/2)<.5;
        const W=dark?[2.6,1.9,1.6,1.4,1.2]:[3,2.3,2,1.7,1.5];
        const c0=ramp(JC,(y+base)/PH),c1=ramp(JC,(y+base+700)/PH),col=mix(c0,c1,k/(N-1));
        COMP=dark?'lighter':null;
        sk(R,pts,{col:dark?col:shade(col,pi>=10?.3:.12),w:W[k],a:dark?.6:.9,amp:.9,taper:'both',noDust:true});
      }
      if(y2>=y1)break;
      y=y2-6;
    }
  }
  COMP=old;
}
// specks of the spine's own colour that drift off it where one scene turns into the next
function dotsBatch(pts){
  pts.sort((a,b)=>a[1]-b[1]);
  for(let i=0;i<pts.length;i+=100){
    const batch=pts.slice(i,i+100),y0=batch[0][1]-4,y1=batch[batch.length-1][1]+4;
    emit(y0,y1,c2=>{for(const p of batch){c2.fillStyle=rgba(p[4],p[3]);c2.beginPath();c2.arc(p[0],p[1],p[2],0,TAU);c2.fill()}});
  }
}
function motes(R,pi,ya,yb,n,spread){
  const lt=[],dk=[];
  for(let i=0;i<n;i++){
    const y=rd(R,ya,yb),gy=pi*PH+y,x=spineX(gy)+(R()+R()+R()-1.5)*spread*.7;
    const dark=lumAt(gy)<.5,c=ramp(JC,gy/PH+rd(R,-.12,.12));
    (dark?dk:lt).push([x,y,rd(R,.6,2),rd(R,.25,.7),dark?mix(c,[255,255,255],.25):shade(c,.15)]);
  }
  const old=COMP;
  COMP='lighter';dotsBatch(dk);
  COMP=null;dotsBatch(lt);
  COMP='lighter';
  for(const p of dk.filter(q=>q[2]>1.6))spark(R,p[0],p[1],rd(R,7,11),{col:p[4],a:.5,w:1,nR:4,noCenter:true});
  COMP=null;
  for(const p of lt.filter(q=>q[2]>1.6))spark(R,p[0],p[1],rd(R,7,11),{col:p[4],a:.55,w:1,nR:4,noCenter:true});
  COMP=old;
}

// ---------------- small helpers ----------------
function hblob(R,cx,cy,rx,ry){
  const ph=rd(R,0,7),pts=[];
  for(let i=0;i<14;i++){const t=i/14*TAU,m=1+.1*Math.sin(t*2+ph)+.05*Math.sin(t*5+ph*2.1);pts.push([cx+Math.cos(t)*rx*m,cy+Math.sin(t)*ry*m])}
  return chaikin(pts,true,1);
}
function circ(R,cx,cy,r){
  const ph=rd(R,0,7),pts=[];
  for(let i=0;i<40;i++){const t=i/40*TAU,m=1+.012*Math.sin(t*3+ph)+.008*Math.sin(t*7+ph*2.1);pts.push([cx+Math.cos(t)*r*m,cy+Math.sin(t)*r*m])}
  return pts;
}
function ePts(cx,cy,rx,ry,rot,n=16){
  const o=[];
  for(let i=0;i<n;i++){const t=i/n*TAU,ux=Math.cos(t)*rx,uy=Math.sin(t)*ry;o.push([cx+ux*Math.cos(rot)-uy*Math.sin(rot),cy+ux*Math.sin(rot)+uy*Math.cos(rot)])}
  return o;
}
function offsetPath(pts,d){
  return pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;return[p[0]+nx/l*d,p[1]+ny/l*d]});
}
// the same line drawn several times, a little apart, each strand its own colour
function strands(R,pts,colFn,n,spread,o){
  for(let s=0;s<n;s++){
    const u=n>1?s/(n-1):.5,col=colFn(u);
    sk(R,n>1?offsetPath(pts,(u-.5)*spread):pts,{...o,col,noDust:true});
  }
}
// a soft light; it may run over into the next scene, so it is only clipped far outside its own
function glow(R,x,y,r,col,a,sx=1){
  const t=Math.max(y-r,-70),bt=Math.min(y+r,1270);
  if(bt<=t)return;
  emit(t,bt,c2=>{
    c2.save();c2.beginPath();c2.rect(x-r*sx,t,2*r*sx,bt-t);c2.clip();
    c2.translate(x,y);c2.scale(sx,1);
    const g=c2.createRadialGradient(0,0,0,0,0,r);
    g.addColorStop(0,rgba(col,a));g.addColorStop(.4,rgba(col,a*.35));g.addColorStop(1,rgba(col,0));
    c2.fillStyle=g;c2.fillRect(-r,-r,2*r,2*r);c2.restore();
  });
}
function say(R,txt,left,dark,y=1100,sz=26){
  const w=measure(txt,sz),x=left?112:1488-w;
  write(R,txt,x,y,sz,{col:dark?CINK:INK,a:.9});
}
function inPoly(Pp,x,y){let c=false;for(let i=0,j=Pp.length-1;i<Pp.length;j=i++){const a=Pp[i],b=Pp[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function dipLine(cx,cy,L,tilt,side,r0){
  const pts=[];
  const a=Math.max(.05,Math.asin(Math.sqrt(Math.min(1,r0/L)))),b=Math.PI-a;
  for(let t=a;t<=b;t+=.035){
    const r=L*Math.sin(t)*Math.sin(t);
    const x=side*r*Math.sin(t),y=-r*Math.cos(t);
    pts.push([cx+x*Math.cos(tilt)-y*Math.sin(tilt),cy+x*Math.sin(tilt)+y*Math.cos(tilt)]);
  }
  return pts;
}
function dustBatch(pts,col,B=150){
  const c=col.slice();
  for(let i=0;i<pts.length;i+=B){
    const batch=pts.slice(i,i+B);
    let y0=1e9,y1=-1e9;
    for(const p of batch){if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
    emit(y0-4,y1+4,c2=>{for(const p of batch){c2.fillStyle=rgba(c,p[3]);c2.beginPath();c2.arc(p[0],p[1],p[2],0,TAU);c2.fill()}});
  }
}
// iron filings, laid down from the source outward
function filings(R,fn,cx,cy,rx,ry,n,o={}){
  const segs=[],ref=o.ref||1;
  for(let i=0;i<n;i++){
    const t=rd(R,0,TAU),d=Math.sqrt(R());
    const x=cx+Math.cos(t)*rx*d,y=cy+Math.sin(t)*ry*d;
    if(o.skip&&o.skip(x,y))continue;
    const f=fn(x,y),mag=Math.hypot(f[0],f[1]);
    if(!(mag>0))continue;
    const p=clamp(Math.pow(mag/ref,o.pw??.42),o.pmin??.1,1)*(1-d*d*d);
    if(R()>p)continue;
    segs.push([x,y,Math.atan2(f[1],f[0])+rd(R,-.09,.09),rd(R,6,11)*(o.len??1),rd(R,.4,.85)*(o.am??1),rd(R,1,1.7)]);
  }
  const ox=o.ox??cx,oy=o.oy??cy;
  segs.sort((a,b)=>Math.hypot(a[0]-ox,a[1]-oy)-Math.hypot(b[0]-ox,b[1]-oy));
  const col=(o.col||FIL).slice(),B=70;
  for(let i=0;i<segs.length;i+=B){
    const batch=segs.slice(i,i+B);
    let y0=1e9,y1=-1e9;
    for(const s of batch){if(s[1]<y0)y0=s[1];if(s[1]>y1)y1=s[1]}
    emit(y0-12,y1+12,c2=>{
      c2.lineCap='round';
      for(const s of batch){
        const c=Math.cos(s[2])*s[3]/2,sn=Math.sin(s[2])*s[3]/2;
        c2.strokeStyle=rgba(col,s[4]);c2.lineWidth=s[5];
        c2.beginPath();c2.moveTo(s[0]-c,s[1]-sn);c2.lineTo(s[0]+c,s[1]+sn);c2.stroke();
      }
    });
  }
}
const magField=(cx,cy,d)=>(x,y)=>{
  let bx=0,by=0;
  for(const [px,q] of [[cx-d,1],[cx+d,-1]]){
    const dx=x-px,dy=y-cy,r2=dx*dx+dy*dy+25,r=Math.sqrt(r2);
    bx+=q*dx/(r2*r);by+=q*dy/(r2*r);
  }
  return [bx,by];
};
// a curtain of light: a wavy lower edge, rays that bend like drapery, a brightness that folds
function curtain(R,x0,x1,yb,hgt,ph,pal,n,o={}){
  const aM=o.a??1,my=o.my||(y=>y),soft=o.soft??1;
  const base=x=>yb+58*Math.sin(x*.0043+ph)+26*Math.sin(x*.0108+ph*1.7)+(fbm(x*.004,ph,3,2)-.5)*80;
  const env=x=>{const e=.5+.5*Math.sin(x*.0066+ph*2.3+Math.sin(x*.0021+ph)*1.6);return .42+.58*e*e};
  const rays=[];
  for(let i=0;i<n;i++){
    const x=x0+(x1-x0)*i/(n-1)+rd(R,-2.5,2.5),b=base(x),e=env(x),uu=(x-x0)/(x1-x0),sm2=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},fade=sm2(uu/.13)*sm2((1-uu)/.13);
    const L=Math.min(hgt*(.42+.62*e)*(.75+.5*fbm(x*.012+ph,2.1,4,2))*(.45+.55*fade),b-90);
    const lean=Math.sin(x*.0062+ph)*50+(fbm(x*.01,ph,6,2)-.5)*50;
    const sw=rd(R,-12,12)+Math.sin(x*.02+ph)*10;
    rays.push([x,b,L,lean,sw,rd(R,1.2,3),(.4+.6*e)*rd(R,.55,1.05)*aM*fade]);
  }
  const B=36;
  for(let i=0;i<rays.length;i+=B){
    const batch=rays.slice(i,i+B);
    let ya=1e9,yz=-1e9;
    for(const r of batch){const t=my(r[1]-r[2]),bt=my(r[1]);ya=Math.min(ya,t,bt);yz=Math.max(yz,t,bt)}
    emit(ya-14,yz+14,c2=>{
      c2.lineCap='round';
      for(const [x,b,L,lean,sw,w,a] of batch){
        const g=c2.createLinearGradient(x,my(b),x+lean,my(b-L));
        g.addColorStop(0,rgba(pal[0],.9*a));g.addColorStop(.14,rgba(pal[0],.7*a));g.addColorStop(.45,rgba(pal[1],.45*a));g.addColorStop(.8,rgba(pal[2],.2*a));g.addColorStop(1,rgba(pal[2],0));
        c2.strokeStyle=g;
        c2.beginPath();c2.moveTo(x,my(b));c2.bezierCurveTo(x+sw,my(b-L*.33),x+lean-sw,my(b-L*.66),x+lean,my(b-L));
        c2.lineWidth=w*6;c2.globalAlpha=.1*soft;c2.stroke();
        c2.globalAlpha=1;c2.lineWidth=w;c2.stroke();
      }
    });
  }
  // the lower edge itself shines: a ribbon the whole curtain hangs from
  const ep=[];for(let x=x0;x<=x1;x+=8)ep.push([x,my(base(x))]);
  strands(R,ep,u=>mix(pal[0],pal[1],.15+.5*u),3,8,{w:2.2,a:.55*aM,amp:.7,taper:'both'});
}

// ---------------- small drawings ----------------
function flowerDraw(R,x,y,s){
  sk(R,[[x,y+s*.9],[x+14,y+s*2.4],[x-6,y+s*4.1],[x+4,y+s*5.1]],{col:[88,120,66],w:7,a:.85,amp:1.4,taper:'out'});
  for(const [dx,dy,rot] of [[-44,y+s*3.0,-.5],[46,y+s*2.2,.5]]){
    const lf=ePts(x+dx,dy,s*.62,s*.2,rot);
    fillPoly(lf,[104,138,76],.8);sk(R,lf.concat([lf[0]]),{col:INK,w:1.3,a:.7,amp:.4});
  }
  for(let k=0;k<12;k++){
    const a=k/12*TAU+rd(R,-.06,.06),pc=[x+Math.cos(a)*s*1.0,y+Math.sin(a)*s*1.0];
    const pet=ePts(pc[0],pc[1],s*.58,s*.24,a);
    fillPoly(pet,[252,248,238],.95);
    sk(R,pet.concat([pet[0]]),{col:INK,w:1.4,a:.8,amp:.4});
  }
  const cd=hblob(R,x,y,s*.5,s*.5);
  fillPoly(cd,[218,150,52],.95);
  sk(R,cd.concat([cd[0]]),{col:INK,w:1.6,a:.85,amp:.4});
  spatter(R,x,y,s*.45,70,COPPER,.7);
}
function beeDraw(R,x,y,s,ang){
  const co=Math.cos(ang),sn=Math.sin(ang);

<script>
// a tap with a finger counts as a click. a phone does not always send a click
// for a tap on a canvas when only the window is listening (safari on the iphone
// does not), so the tap is read from the touch itself. a real click that follows
// is the same tap, and is let go.
(function(){
  let down=null,last=-1e9;
  const skip=el=>el&&el.closest&&el.closest('a,button,nav,input,label,select,textarea,summary');
  addEventListener('touchstart',e=>{down=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:performance.now()}:null},{passive:true});
  addEventListener('touchmove',e=>{if(down&&Math.hypot(e.touches[0].clientX-down.x,e.touches[0].clientY-down.y)>12)down=null},{passive:true});
  addEventListener('touchcancel',()=>{down=null},{passive:true});
  addEventListener('touchend',e=>{
    const d=down,t=e.changedTouches[0];down=null;
    if(!d||!t||e.touches.length||performance.now()-d.t>600||Math.hypot(t.clientX-d.x,t.clientY-d.y)>12)return;
    const el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
    if(skip(el)){last=-1e9;return}
    last=performance.now();
    el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY,screenX:t.screenX,screenY:t.screenY}));
  },{passive:true});
  addEventListener('click',e=>{if(e.isTrusted&&performance.now()-last<800&&!skip(e.target)){e.stopImmediatePropagation();e.preventDefault()}},true);
})();
</script>
