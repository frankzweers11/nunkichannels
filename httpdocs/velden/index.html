<script>
'use strict';
// ---------------------------------------------------------------------------
// velden — an electromagnetic universe, drawn as one journey.
// a single wall, no frames, from night to day: one line of force runs from a
// magnet in the dark through light, a galaxy, a solar storm, an aurora, birds,
// a brain, a heart and a strand of dna, through the one who looks, and with the
// first light of morning down to the masts on the horizon and the flower in the
// grass where a bee is flying.
// every mark is laid down by a wandering hand while you watch; nothing here
// is ruled. a sentence is something known, a question is something open.
// the engine (tiles, queued strokes, pencil lettering) follows the technique
// of the fable wall that inspired it.
// ---------------------------------------------------------------------------
const TAU = Math.PI*2;
const qs = new URLSearchParams(location.search);
const SEED = +(qs.get('s')||7);
const FAST = qs.has('fast');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------- rng ----------------
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function stream(n){const f=mul32((n*2654435761)>>>0);for(let i=0;i<9;i++)f();return f}
const rd=(R,a,b)=>a+R()*(b-a);
const ri=(R,a,b)=>Math.floor(rd(R,a,b+1));
const ch_=(R,p)=>R()<p;
const pk=(R,arr)=>arr[(R()*arr.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ---------------- noise ----------------
function h2(x,y,s){const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return h2(xi,yi,s)*(1-u)*(1-v)+h2(xi+1,yi,s)*u*(1-v)+h2(xi,yi+1,s)*(1-u)*v+h2(xi+1,yi+1,s)*u*v}
function fbm(x,y,s,o){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=vn(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2.03}return t/n}

// ---------------- colour ----------------
const INK=[42,37,31], CINK=[238,231,210];
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const shade=(c,k)=>[c[0]*(1-k),c[1]*(1-k),c[2]*(1-k)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
let CUR=INK;

// ---------------- the wall ----------------
const LW=1600, TILEH=1200, TOTALH=14400+260;
const NT=Math.ceil(TOTALH/TILEH);
let S=Math.min(1.35, Math.max(1, window.devicePixelRatio||1));
if(navigator.deviceMemory && navigator.deviceMemory<8) S=1.1;
const wallEl=document.getElementById('wall');
wallEl.style.height=(TOTALH/LW*100)+'vw';
const TILES=[];
for(let i=0;i<NT;i++){
  const y0=i*TILEH, h=Math.min(TILEH+2, TOTALH-y0);
  const cv=document.createElement('canvas');
  cv.width=Math.round(LW*S); cv.height=Math.round(h*S);
  cv.style.top=(y0/LW*100)+'vw';
  cv.style.height=(h/LW*100)+'vw';
  wallEl.appendChild(cv);
  const cx=cv.getContext('2d');
  cx.lineCap='round'; cx.lineJoin='round';
  TILES.push({cv,cx,y0,h,q:[],qi:0,done:false,active:i===0});
}
let GENDONE=false;
// route one drawing act to every tile it touches; whole passages of the wall
// can be shifted down as one piece by GEN_DY
let DIRECT=null, GEN_DY=0;
let COMP=null; // when set (e.g. 'lighter'), every mark queued meanwhile is drawn with that blend: light on dark glows
function emit(y0,y1,fn){
  if(COMP){const f0=fn,cm=COMP;fn=c=>{c.save();c.globalCompositeOperation=cm;f0(c);c.restore()}}
  if(DIRECT){
    DIRECT.cx.setTransform(S,0,0,S,0,-DIRECT.y0*S);
    if(GEN_DY){DIRECT.cx.save();DIRECT.cx.translate(0,GEN_DY);fn(DIRECT.cx);DIRECT.cx.restore()}
    else fn(DIRECT.cx);
    return;
  }
  const dy=GEN_DY;
  const f=dy?cx=>{cx.save();cx.translate(0,dy);fn(cx);cx.restore()}:fn;
  const a=clamp(Math.floor((y0+dy-60)/TILEH),0,NT-1), b=clamp(Math.floor((y1+dy+60)/TILEH),0,NT-1);
  for(let i=a;i<=b;i++) TILES[i].q.push(f);
}

// ---------------- geometry ----------------
function resample(pts,step){
  if(pts.length<2)return pts.slice();
  const out=[[pts[0][0],pts[0][1]]];let need=step;
  for(let i=1;i<pts.length;i++){
    let x0=pts[i-1][0],y0=pts[i-1][1];
    const x1=pts[i][0],y1=pts[i][1];
    let d=Math.hypot(x1-x0,y1-y0);
    while(d>=need&&d>0){const t=need/d;x0+=(x1-x0)*t;y0+=(y1-y0)*t;out.push([x0,y0]);d=Math.hypot(x1-x0,y1-y0);need=step}
    need-=d;
  }
  const last=pts[pts.length-1],le=out[out.length-1];
  if(Math.hypot(last[0]-le[0],last[1]-le[1])>step*.2||out.length<2)out.push([last[0],last[1]]);
  return out;
}
function chaikin(pts,closed,it){
  while(it-->0){
    const out=[],n=pts.length;
    if(n<3)return pts;
    if(!closed)out.push(pts[0]);
    const end=closed?n:n-1;
    for(let i=0;i<end;i++){
      const a=pts[i],b=pts[(i+1)%n];
      out.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);
    }
    if(!closed)out.push(pts[n-1]);
    pts=out;
  }
  return pts;
}
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
  return[x0,y0,x1,y1]}
function blob(R,cx,cy,rx,ry){
  const rot=rd(R,0,TAU),ph=rd(R,0,7),n=14,pts=[];
  for(let i=0;i<n;i++){
    const t=i/n*TAU;
    const m=1+.16*Math.sin(t*2+ph)+.09*Math.sin(t*5+ph*2.1);
    const x=Math.cos(t)*rx*m,y=Math.sin(t)*ry*m;
    pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);
  }
  return chaikin(pts,true,1);
}
function spiralPts(cx,cy,rOut,rIn,turns,ph,dir=1){
  const n=Math.max(24,Math.round(turns*30)),pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n,th=ph+dir*t*turns*TAU,r=rOut+(rIn-rOut)*t;
    pts.push([cx+Math.cos(th)*r,cy+Math.sin(th)*r]);
  }
  return pts;
}

// ---------------- the hand ----------------
// every mark wanders off its intended path a little. pressed marks get a
// second pass, the way a pen goes back over a line it means.
function wob(R,rs,amp){
  const n=rs.length,q=[];
  const P1=rd(R,0,7),P2=rd(R,0,7),P3=rd(R,0,7);
  const F1=rd(R,1.6,3.2),F2=rd(R,5,9);
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const A=rs[Math.max(0,i-1)],B=rs[Math.min(n-1,i+1)];
    let nx=-(B[1]-A[1]),ny=B[0]-A[0];
    const d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;
    const off=amp*(.62*Math.sin(t*F1*2+P1)+.28*Math.sin(t*F2+P2)+.10*Math.sin(t*17+P3));
    q.push([rs[i][0]+nx*off+rd(R,-.3,.3),rs[i][1]+ny*off+rd(R,-.3,.3)]);
  }
  return q;
}
function sk(R,pts,o={}){
  const w=o.w??1.3, a0=o.a??.7;
  const rs=resample(pts,Math.max(2.4,w*1.5));
  const n=rs.length;
  if(n<2)return;
  const col=(o.col||CUR).slice();
  const passes=o.passes??1;
  const [bx0,by0,bx1,by1]=bbox(rs);
  for(let p=0;p<passes;p++){
    const amp=(o.amp??(w*.38+.55))*(p?1.5:1);
    const alpha=a0*(p?.35:1);
    const q=wob(R,rs,amp);
    if(o.taper){
      const segs=[];
      for(let i=1;i<n;i++){
        const t=i/(n-1);
        let e;
        if(o.taper==='out')e=.3+.7*(1-t);
        else if(o.taper==='in')e=.3+.7*t;
        else e=.35+.65*Math.min(1,Math.min(t,1-t)/.25);
        segs.push([q[i-1],q[i],rgba(col,alpha*rd(R,.8,1)),Math.max(.5,w*e*rd(R,.85,1.15))]);
      }
      emit(by0,by1,cx=>{
        cx.lineCap='round';
        for(const s of segs){
          cx.strokeStyle=s[2];cx.lineWidth=s[3];
          cx.beginPath();cx.moveTo(s[0][0],s[0][1]);cx.lineTo(s[1][0],s[1][1]);cx.stroke();
        }
      });
    } else {
      const lifts=[];
      for(let i=0;i<n;i++)lifts.push(o.gap?ch_(R,o.gap):false);
      const st=rgba(col,alpha), lw=w*rd(R,.85,1.12);
      emit(by0,by1,cx=>{
        cx.lineCap='round';cx.lineJoin='round';
        cx.beginPath();
        let lift=false;
        for(let i=0;i<n;i++){
          if(!i||lift)cx.moveTo(q[i][0],q[i][1]);else cx.lineTo(q[i][0],q[i][1]);
          lift=lifts[i];
        }
        cx.strokeStyle=st;cx.lineWidth=lw;cx.stroke();
      });
    }
    if(p===0&&w>=1.9&&!o.noDust){
      const specks=[];
      for(let i=0;i<n;i+=3){
        if(ch_(R,.6))continue;
        const sz=rd(R,.6,1.2);
        specks.push([q[i][0]+rd(R,-w,w)-sz/2,q[i][1]+rd(R,-w,w)-sz/2,sz,rgba(col,a0*rd(R,.14,.3))]);
      }
      if(specks.length)emit(by0,by1,cx=>{for(const s of specks){cx.fillStyle=s[3];cx.fillRect(s[0],s[1],s[2],s[2])}});
    }
  }
}
function dotF(R,x,y,r,a,col){
  const c=(col||CUR).slice(),pts=[];
  const n=8,ph=rd(R,0,7);
  for(let i=0;i<=n;i++){
    const t=i/n*TAU,m=1+.2*Math.sin(t*2+ph);
    pts.push([x+Math.cos(t)*r*m+rd(R,-.2,.2),y+Math.sin(t)*r*m+rd(R,-.2,.2)]);
  }
  emit(y-r-2,y+r+2,cx=>{
    cx.beginPath();
    for(let i=0;i<pts.length;i++){i?cx.lineTo(pts[i][0],pts[i][1]):cx.moveTo(pts[i][0],pts[i][1])}
    cx.closePath();cx.fillStyle=rgba(c,a);cx.fill();
  });
}
function ell(R,cx,cy,rx,ry,o={}){
  const n=Math.max(10,Math.round((rx+ry)/2)),rot=rd(R,0,TAU),pts=[];
  for(let i=0;i<n;i++){
    const t=i/n*TAU;
    const x=Math.cos(t)*rx,y=Math.sin(t)*ry;
    pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);
  }
  pts.push(pts[0]);
  sk(R,pts,o);
}
function fillPoly(pts,col,a){
  const [x0,y0,x1,y1]=bbox(pts);
  const st=rgba(col,a),P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}
    cx.closePath();cx.fillStyle=st;cx.fill();
  });
}
// scribble a region full, clipped, in one act
function scribFill(R,pts,sp,a,o={}){
  const [x0,y0,x1,y1]=bbox(pts);
  const col=(o.col||CUR).slice(), w=o.w??1;
  const lines=[],slope=rd(R,-.2,.2);
  for(let y=y0-sp;y<y1+sp;y+=sp*rd(R,.8,1.2)){
    const raw=[],ph=rd(R,0,7);
    for(let x=x0;x<=x1;x+=4)raw.push([x,y+(x-x0)*slope+Math.sin(x*.5+ph)*sp*.42+rd(R,-.8,.8)]);
    if(raw.length>1)lines.push([wob(R,resample(raw,3.2),.55),rgba(col,a*rd(R,.6,1.05)),w*rd(R,.85,1.12)]);
  }
  const P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.save();
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}
    cx.closePath();cx.clip();
    cx.lineCap='round';
    for(const L of lines){
      cx.strokeStyle=L[1];cx.lineWidth=L[2];
      cx.beginPath();
      const q=L[0];
      cx.moveTo(q[0][0],q[0][1]);
      for(let i=1;i<q.length;i++)cx.lineTo(q[i][0],q[i][1]);
      cx.stroke();
    }
    cx.restore();
  });
}
// a soft coloured-pencil scrub, never quite inside the lines
function scrub(R,cx,cy,r,col,a=.4){
  const b=blob(R,cx,cy,r*rd(R,1,1.12),r*rd(R,.82,1));
  fillPoly(b,col,.1);
  scribFill(R,b,Math.max(3,r*.13),a,{col});
}
function spatter(R,x,y,r,n,col,a=.5){
  const sd=ri(R,0,99999),c=col.slice();
  emit(y-r,y+r,cx=>{
    const RR=mul32(sd);
    for(let i=0;i<n;i++){
      const t=RR()*TAU,d=Math.sqrt(RR())*r;
      const s=.8+RR()*RR()*2.2;
      cx.fillStyle=rgba(c,a*(.3+RR()*.7));
      cx.fillRect(x+Math.cos(t)*d,y+Math.sin(t)*d*.7,s,s*(.8+RR()*.5));
    }
  });
}
function drip(R,x,y,len,col,a=.3,w=2){
  const pts=[[x,y]];
  let px=x;
  for(let d=0;d<len;d+=9){px+=rd(R,-1.4,1.4);pts.push([px,y+d])}
  sk(R,pts,{col,w,a,taper:'out',amp:.4});
  dotF(R,px,y+len,w*1.1,a*1.2,col);
}
function arrowHead(R,x,y,ang,sz,a,col,w=1.6){
  for(const sd of[-1,1])
    sk(R,[[x,y],[x-Math.cos(ang+sd*.5)*sz,y-Math.sin(ang+sd*.5)*sz]],{col,w,a,taper:'out'});
}
function spark(R,x,y,r,o={}){
  const n=o.nR??ri(R,5,8);
  const rot=rd(R,0,TAU),col=o.col||CUR;
  for(let i=0;i<n;i++){
    const a=rot+i/n*TAU+rd(R,-.14,.14)/n*TAU;
    const r0=r*rd(R,.22,.34),r1=r*rd(R,.85,1.1)*(i%2?.78:1);
    sk(R,[[x+Math.cos(a)*r0,y+Math.sin(a)*r0],[x+Math.cos(a)*r1,y+Math.sin(a)*r1]],
      {col,w:o.w??1.3,a:(o.a??.75)*rd(R,.8,1),taper:'out',amp:.3});
  }
  if(!o.noCenter&&ch_(R,.55))dotF(R,x,y,Math.max(1,r*.13),(o.a??.75),col);
}

// ---------------- asemic writing ----------------
// a few marks need writing that only looks like writing: field notes nobody can read.
function aword(R,x,y,h,nl,o={}){
  const pts=[[x,y+rd(R,-.1,.1)*h]];
  let cx=x;
  for(let i=0;i<nl;i++){
    const up=y-h*rd(R,.32,.62)-(ch_(R,.13)?h*rd(R,.4,.75):0);
    const dn=y+(ch_(R,.09)?h*rd(R,.3,.55):h*rd(R,-.06,.12));
    cx+=h*rd(R,.18,.3);pts.push([cx,up]);
    cx+=h*rd(R,.18,.3);pts.push([cx,dn]);
  }
  sk(R,chaikin(pts,false,1),{col:o.col,w:o.w??.9,a:o.a??.55,amp:.28});
  return cx-x;
}

// ---------------- hand lettering ----------------
// a real alphabet, one wobbly stroke at a time. used rarely, like pencil notes.
const A_=(cx,cy,rx,ry,a0,a1,n=9)=>{const p=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;p.push([cx+Math.cos(t)*rx,cy+Math.sin(t)*ry])}return p};
const GL={};

function tick(now){
  const sy=scrollY/CSSK, vh=innerHeight/CSSK;
  for(const T of TILES) if(!T.active && T.y0 < sy+vh*1.8) T.active=true;
  const budget=(FAST||RM)?200:7;
  const t0=performance.now();
  for(const T of TILES){
    if(!T.active||T.done)continue;
    T.cx.setTransform(S,0,0,S,0,-T.y0*S);
    while(T.qi<T.q.length){

  }

// ---------------- restlessness ----------------
// a few marks cannot hold still. every so often one erases itself and is
// drawn again, never quite the same, like a field line that is only drawn once it is felt.
const RESTLESS=[];
function restless(x,y,w,h,fn){RESTLESS.push({x,y:y+GEN_DY,w,h,fn,dy:GEN_DY,img:null,next:0,tile:null})}
function readyRestless(T){
  if(RM)return;
  for(const r of RESTLESS){
    if(r.img)continue;
    if(r.y>=T.y0&&r.y+r.h<=T.y0+T.h&&T.done){
      r.tile=T;
      const px=Math.round(r.x*S),py=Math.round((r.y-T.y0)*S);
      const pw=Math.round(r.w*S),ph=Math.round(r.h*S);
      try{r.img=T.cx.getImageData(px,py,pw,ph);r.px=px;r.py=py;
          r.next=performance.now()+2000+Math.random()*3000;}catch(e){}
    }
  }
}
let restR=stream(SEED*77+3);
function runRestless(now){
  for(const r of RESTLESS){
    if(!r.img||now<r.next)continue;
    const cx=r.tile.cx;
    cx.putImageData(r.img,r.px,r.py);
    cx.save();
    cx.setTransform(S,0,0,S,0,-r.tile.y0*S);
    cx.beginPath();cx.rect(r.x,r.y,r.w,r.h);cx.clip();
    DIRECT=r.tile; GEN_DY=r.dy;
    r.fn(restR);
    GEN_DY=0; DIRECT=null;
    cx.restore();
    r.next=now+2600+Math.random()*4200;
  }
}

function drawTrail(now){
  if(RM){trailCx.clearRect(0,0,innerWidth,innerHeight);return}

  if(TP.length<2)return;
  const col=lumAt((scrollY+innerHeight/2)/CSSK)<.45?CINK:INK;
  const LIFE=3800;
  while(TP.length&&now-TP[0].t>LIFE)TP.shift();
  for(let i=1;i<TP.length;i++){
    const a=TP[i-1],b=TP[i];
    if(b.t-a.t>110)continue;
    const age=(now-b.t)/LIFE;

    if(k<=0)continue;
    const wobx=Math.sin(now*.0011+i*.7)*1.3*age, woby=Math.cos(now*.0009+i*1.1)*1.3*age;
    trailCx.strokeStyle=rgba(col,.2*k*k);

    trailCx.moveTo(a.x+wobx,a.y+woby);

// velden — twelve scenes on one wall, top to bottom. every scene is drawn in
// local coordinates 0..1600 x 0..1200; GEN_DY lifts it to its place.

// there are no cards: the wall itself is one long sheet that goes from night
// to day as you scroll, and the scenes are drawn straight onto it.
// one braided line of force (the spine) runs the whole way down. it leaves a
// magnet in the dark, turns into light, rides through a galaxy, a solar storm
// and an aurora, passes birds, a thought, a heart and a strand of dna, runs
// through the one who looks, and with the first light of morning comes down to
// the masts on the horizon and, below them, to the flower in the grass where a

// ---------------- the journey: colour and the spine ----------------
const JC=[[0,ELEC],[1,[120,110,225]],[2.1,[170,100,215]],[3.2,[255,170,70]],[4.2,AUR_G],[5.2,[120,170,240]],
  [6.2,AUR_V],[7.2,[232,92,122]],[8.2,[90,150,214]],[9.3,[240,196,120]],[10.3,[104,122,214]],[11.2,[232,120,150]],[12,[240,176,70]]];
function ramp(st,t){
  if(t<=st[0][0])return st[0][1];
  for(let i=1;i<st.length;i++)if(t<=st[i][0]){const a=st[i-1],b=st[i];return mix(a[1],b[1],(t-a[0])/((b[0]-a[0])||1))}
  return st[st.length-1][1];
}
// waypoints of the spine in wall coordinates: it zigzags so each scene keeps
// one bottom corner free for its sentence
const SMID=[0,820,780,850,800,760,900,800,840,820,800,820];
const SWX={1:[[560,1330],[800,1330]],9:[[110,1000],[290,905],[408,872]],11:[[200,1010],[340,1004]]};
const SW=[[700,950],[800,1012]];
for(let i=0;i<12;i++){
  if(i>0)for(const m of(SWX[i]||[[600,SMID[i]]]))SW.push([i*PH+m[0],m[1]]);
  // the line ends in the bee, so the last scene has no way out
  if(i<11)SW.push([i*PH+1150,i%2===0?940:640]);
}
function spineX(gy){
  let i=0;
  while(i<SW.length-2&&SW[i+1][0]<gy)i++;
  const [ya,xa]=SW[i],[yb,xb]=SW[i+1];
  let t=clamp((gy-ya)/(yb-ya||1),0,1);
  t=t*t*(3-2*t);
  return xa+(xb-xa)*t+Math.sin(gy*.0047+1)*10;
}
const SPEND=392;
// five strands, braided. on dark paper they glow, on light paper they are pencil
function spine(R,pi,y0,y1){
  const base=pi*PH,N=5,old=COMP;
  for(let k=0;k<N;k++){
    let y=y0;
    while(y<y1){
      const y2=Math.min(y1,y+rd(R,240,380)),pts=[];
      for(let yy=y;yy<=y2;yy+=11){
        const gy=yy+base;
        let off=(k-2)*(5+4*Math.sin(gy*.0021+k))+11*Math.sin(gy*(.0062+.0009*k)+k*1.3);
        // the lines fan out from the pole, come together in the one who looks and open up again,
        // and gather once more in the bee
        if(pi===0)off*=clamp((yy-700)/150,0,1);
        if(pi===9)off*=clamp(Math.abs(yy-408)/210,.04,1);
        if(pi===11)off*=clamp((SPEND-yy)/200,.04,1);
        pts.push([spineX(gy)+off,yy]);
      }
      if(pts.length>1){
        const dark=lumAt(base+(y+y2)/2)<.5;
        const W=dark?[2.6,1.9,1.6,1.4,1.2]:[3,2.3,2,1.7,1.5];
        const c0=ramp(JC,(y+base)/PH),c1=ramp(JC,(y+base+700)/PH),col=mix(c0,c1,k/(N-1));
        COMP=dark?'lighter':null;
        sk(R,pts,{col:dark?col:shade(col,pi>=10?.3:.12),w:W[k],a:dark?.6:.9,amp:.9,taper:'both',noDust:true});
      }
      if(y2>=y1)break;
      y=y2-6;
    }
  }

}
// specks of the spine's own colour that drift off it where one scene turns into the next
function dotsBatch(pts){
  pts.sort((a,b)=>a[1]-b[1]);
  for(let i=0;i<pts.length;i+=100){
    const batch=pts.slice(i,i+100),y0=batch[0][1]-4,y1=batch[batch.length-1][1]+4;
    emit(y0,y1,c2=>{for(const p of batch){c2.fillStyle=rgba(p[4],p[3]);c2.beginPath();c2.arc(p[0],p[1],p[2],0,TAU);c2.fill()}});
  }

function motes(R,pi,ya,yb,n,spread){
  const lt=[],dk=[];
  for(let i=0;i<n;i++){
    const y=rd(R,ya,yb),gy=pi*PH+y,x=spineX(gy)+(R()+R()+R()-1.5)*spread*.7;
    const dark=lumAt(gy)<.5,c=ramp(JC,gy/PH+rd(R,-.12,.12));

function circ(R,cx,cy,r){

  const env=x=>{const e=.5+.5*Math.sin(x*.0066+ph*2.3+Math.sin(x*.0021+ph)*1.6);return .42+.58*e*e};

  }

  for(let i=0;i<rays.length;i+=B){

    for(const r of batch){const t=my(r[1]-r[2]),bt=my(r[1]);ya=Math.min(ya,t,bt);yz=Math.max(yz,t,bt)}

      c2.lineCap='round';

        const g=c2.createLinearGradient(x,my(b),x+lean,my(b-L));
        g.addColorStop(0,rgba(pal[0],.9*a));g.addColorStop(.14,rgba(pal[0],.7*a));g.addColorStop(.45,rgba(pal[1],.45*a));g.addColorStop(.8,rgba(pal[2],.2*a));g.addColorStop(1,rgba(pal[2],0));

  }

  const ep=[];for(let x=x0;x<=x1;x+=8)ep.push([x,my(base(x))]);

}

// a stroke whose strength follows a function of position: rings use it to die away toward the edge of their box

function wobbleRing(R,cx,cy,r,ry,ph,col,w,a,from=0,to=TAU,clip=null,fade=0){

// blades of grass: thin filled slivers that lean and bend, laid down in batches.
// each is [x, base y, height, lean, width, colour, alpha]
function bladesBatch(R,list){
  list.sort((a,b)=>a[1]-b[1]);
  const B=48;
  for(let i=0;i<list.length;i+=B){
    const batch=list.slice(i,i+B);
    let y0=1e9,y1=-1e9;
    const shapes=batch.map(b=>{
      const [x,y,h,lean,w,col,a]=b,bend=rd(R,-.5,.5)*h*.3,L=[],Rr=[],n=7;
      for(let k=0;k<=n;k++){
        const t=k/n,cx=x+lean*h*t+bend*t*t,cy=y-h*t,ww=w*.5*Math.pow(1-t,.85)+.12;
        L.push([cx-ww,cy]);Rr.push([cx+ww,cy]);
      }
      y0=Math.min(y0,y-h-4);y1=Math.max(y1,y+4);
      return {poly:L.concat(Rr.reverse()),fill:rgba(col,a),edge:rgba(shade(col,.35),a*.55),mid:[x+lean*h*.5+bend*.25,y-h*.5]};
    });
    emit(y0,y1,c2=>{
      for(const s of shapes){
        c2.beginPath();s.poly.forEach((p,j)=>j?c2.lineTo(p[0],p[1]):c2.moveTo(p[0],p[1]));c2.closePath();
        c2.fillStyle=s.fill;c2.fill();
        c2.strokeStyle=s.edge;c2.lineWidth=.7;c2.stroke();
      }
    });
  }
}

  }
  restless(200,330,1280,440,RR=>{for(let k=0;k<3;k++){const t=rd(RR,.2,.85),p=bez(3,t),s2=rd(RR,17,27);birdW(RR,p[0]+rd(RR,-30,30),p[1]+rd(RR,-30,30),s2,[246,240,255],.8,1.5+s2*.045)}});
  say(R,'door magnetische stromen weet de vogel waar het noorden is',false,true);
  spine(R,5,0,1230);
  motes(R,5,1090,1300,34,70);
  whispers(R,100,1000,true,2);

// P6 · the brain ---------------------------------------------------------------------------
P.push(function(){
  const R=stream(SEED*101+7);
  const nx=520,ny=500,ns=150;
  COMP='lighter';
  glow(R,nx,ny,360,[130,100,230],.36);
  // brain waves, flowing across the whole wall
  [[3,40,860],[7,30,920],[12,24,980],[22,17,1040]].forEach(([f,a,y],i)=>{
    const pts=[];for(let x=-20;x<=1620;x+=4)pts.push([x,y+Math.sin(x/1400*f*TAU+i)*a*.6*(1+.3*Math.sin(x*.01))]);
    strands(R,pts,u=>ramp([[0,AUR_B],[.5,AUR_V],[1,AUR_P]],clamp(i/3*.6+u*.4,0,1)),3,7,{w:2,a:.58,amp:.6});

  for(let i=0;i<9;i++)wobbleRing(R,nx,ny,70+i*34,(70+i*34)*.9,i*.8,ramp([[0,AUR_P],[.5,AUR_V],[1,AUR_T]],i/8),2.1,.62-i*.045);
  COMP=null;

  for(let k=0;k<3;k++)branch(R,nx-ns*.3,ny+ns*.15,Math.PI*.8+rd(R,-.4,.4),ns*.85,2,CINK,2.6);
  const ax=chaikin([[nx+60,ny+20],[nx+210,ny+80],[nx+380,ny+60],[nx+560,ny+150],[nx+680,ny+230]],false,2);
  sk(R,ax,{col:CINK,w:4,a:.85,amp:1,noDust:true});
  for(let k=1;k<ax.length-4;k+=4){const a2=ax[k],b2=ax[k+2],m=ePts((a2[0]+b2[0])/2,(a2[1]+b2[1])/2,18,7,Math.atan2(b2[1]-a2[1],b2[0]-a2[0]),12);fillPoly(m,[150,120,190],.6);sk(R,m.concat([m[0]]),{col:CINK,w:1,a:.5,amp:.3})}
  for(let k=0;k<4;k++){const e=ax[ax.length-1],a=Math.PI/2+rd(R,-.9,.9);sk(R,[[e[0],e[1]],[e[0]+Math.cos(a)*40,e[1]+Math.sin(a)*40]],{col:CINK,w:2,a:.8,amp:.4,taper:'out'});dotF(R,e[0]+Math.cos(a)*44,e[1]+Math.sin(a)*44,4,.8,CINK)}

  const el=ax.filter(p=>p[0]>nx+170&&p[0]<nx+640);
  restless(nx+140,ny-20,640,340,RR=>{const q=pk(RR,el);spark(RR,q[0],q[1],14,{col:AUR_T,a:.95,w:1.8,nR:ri(RR,5,8)})});
  say(R,'waar komt die gedachte vandaan?',true,true);
  spine(R,6,0,1230);

});

// P7 · the heart ----------------------------------------------------------------------------
P.push(function(){
  const R=stream(SEED*101+8);
  const hx=800,hy=520,hs=150,tilt=.2;
  const gr=u=>ramp([[0,[255,104,124]],[.5,[240,122,200]],[1,[164,134,252]]],u);
  const loops=(RR,ks,a0)=>{ks.forEach((k,i)=>{for(const side of[-1,1]){
    const pts=dipLine(hx,hy,hs*k,tilt,side,hs*.55);
    strands(RR,pts,u=>gr(clamp(i/Math.max(1,ks.length-1)*.8+u*.2,0,1)),4,10,{w:2.1,a:a0-i*.045,amp:.8,taper:'both'});
  }})};
  COMP='lighter';
  glow(R,hx,hy,560,[240,110,150],.24);glow(R,hx,hy,250,[255,120,130],.26);
  COMP=null;
  spine(R,7,0,1230);
  COMP='lighter';
  loops(R,[1.4,1.7,2.1,2.5,2.9,3.3,3.7],.8);
  for(let i=0;i<3;i++){const ep=ePts(hx,hy+10,hs*(1.5+i*.8),hs*(.34+i*.14),tilt,40);sk(R,ep.concat([ep[0]]),{col:gr(i/2),w:1.2,a:.28,amp:.8})}
  COMP=null;

  restless(hx-470,100,940,760,RR=>{COMP='lighter';loops(RR,[rd(RR,1.4,2.8)],.5);COMP=null});
  say(R,'hoe groot is het veld rondom je hart?',false,true);
  motes(R,7,1090,1300,28,70);
  whispers(R,160,900,true,2);
});

// P8 · the strand ------------------------------------------------------------------------------
P.push(function(){
  const R=stream(SEED*101+9);
  const hx=470,y0=170,y1=1020,per=210,amp=122;
  COMP='lighter';
  glow(R,hx,600,420,[120,80,220],.2);
  // waves that arrive from far away, as flowing as the rest
  // (they fade in from above and out below instead of simply stopping)
  const akf=(x,y)=>clamp((y+60)/200,0,1)*clamp((1180-y)/200,0,1);
  const arcs=(RR,rs,a0,plo,phi,xlo)=>rs.forEach((r,i)=>{
    const pts=[];for(let t=Math.PI-.8;t<=Math.PI+.8;t+=.02){const m=1+.02*Math.sin(t*9+i);const px=1900+Math.cos(t)*r*m,py=600+Math.sin(t)*r*m;if(px>xlo&&py>plo&&py<phi)pts.push([px,py])}
    if(pts.length>2)fstrands(RR,pts,u=>ramp([[0,AUR_T],[.5,AUR_B],[1,AUR_P]],clamp(i/8*.7+u*.3,0,1)),3,8,{w:2.2,a:Math.max(.2,a0-i*.035),amp:.9},akf);
  });
  arcs(R,[760,826,892,958,1024,1090,1156,1222,1290],.78,-60,1180,560);
  restless(560,120,950,1010,RR=>{COMP='lighter';arcs(RR,[rd(RR,740,1290)],.5,150,1000,600);COMP=null});
  const seg=(sgn,front)=>{
    for(let y=y0;y<y1;y+=5){
      const ph1=(y-y0)/per*TAU,ph2=(y+5-y0)/per*TAU,z=Math.cos((ph1+ph2)/2)*sgn;
      if((z>0)!==front)continue;
      sk(R,[[hx+sgn*Math.sin(ph1)*amp,y],[hx+sgn*Math.sin(ph2)*amp,y+5]],{col:sgn>0?AUR_B:[236,130,180],w:front?5:2.2,a:front?.95:.5,amp:.2,noDust:true});
    }
  };
  seg(1,false);seg(-1,false);
  for(let y=y0;y<=y1;y+=17){
    const ph=(y-y0)/per*TAU,sx=Math.sin(ph)*amp;
    if(Math.abs(sx)<16)continue;
    const pr=pk(R,[[SOL_Y,AUR_B],[AUR_P,AUR_G]]);
    sk(R,[[hx+sx,y],[hx,y]],{col:pr[0],w:2.4,a:.72,amp:.3});sk(R,[[hx,y],[hx-sx,y]],{col:pr[1],w:2.4,a:.72,amp:.3});
  }
  seg(1,true);seg(-1,true);
  COMP=null;
  say(R,'vormt het dna een antenne?',true,true);
  spine(R,8,0,1230);
  motes(R,8,1090,1300,30,70);
  whispers(R,100,1000,true,2);
});

// P9 · you ----------------------------------------------------------------------------------------
// the last of the night: a person under the stars, with the field going through them.
// below, the sky is already turning
P.push(function(){
  const R=stream(SEED*101+11);
  const fx=spineX(9*PH+470),fy=470;
  COMP='lighter';
  glow(R,fx,fy+30,520,[120,110,230],.22);glow(R,fx,fy-20,200,[240,130,170],.28);
  // the layers around a person: the heart's own, the earth's, everyone else's
  for(let i=0;i<9;i++){
    const rx=120+i*50,ry=180+i*35,col=ramp([[0,[240,120,160]],[.45,AUR_V],[1,AUR_T]],i/8),cl=[20,0,1580,1300];
    wobbleRing(R,fx,fy+50,rx,ry,i*.7,col,1.7,.5-i*.035,0,TAU,cl);

    return [Mg*(3*dm*dx/r)/(r2*r),Mg*(3*dm*dy/r+1)/(r2*r)-1];
  },fx,fy+40,640,330,2600,{col:[200,200,220],am:.55,ref:1.2,pw:.3,pmin:.3,ox:fx,oy:fy,skip:(x,y)=>Math.abs(x-fx)<40&&y>fy-130&&y<fy+300||y<220||y>880});
  const C=CINK;
  ell(R,fx,fy-118,15,16,{col:C,w:2.2,a:.9,amp:.3});
  sk(R,[[fx,fy-100],[fx,fy+10]],{col:C,w:3,a:.9,amp:.4});
  sk(R,[[fx,fy-80],[fx-28,fy-20]],{col:C,w:2.6,a:.85,amp:.3});sk(R,[[fx,fy-80],[fx+28,fy-20]],{col:C,w:2.6,a:.85,amp:.3});
  sk(R,[[fx,fy+10],[fx-22,fy+110]],{col:C,w:2.8,a:.9,amp:.4});sk(R,[[fx,fy+10],[fx+22,fy+110]],{col:C,w:2.8,a:.9,amp:.4});
  spark(R,fx+4,fy-62,18,{col:LAMPW,a:.95,w:2,nR:8});
  restless(fx-34,fy-98,76,76,RR=>spark(RR,fx+4,fy-62,18+rd(RR,0,6),{col:LAMPW,a:.95,w:2,nR:ri(RR,7,10)}));
  say(R,'ook jij staat midden in een zee van golven',false,true,1040);
  spine(R,9,0,1230);
  motes(R,9,1000,1300,34,80);
  whispers(R,100,860,true,2);
});

// P10 · what we add ------------------------------------------------------------------------------
// the day has come: masts on the horizon, and the waves they add to the sky
P.push(function(){
  const R=stream(SEED*101+10);
  const hz=900,masts=[[330,430],[1270,360]],CL=[30,30,1570,1180],FD=130;
  // the sun is only just up behind the horizon: a wide warm light, and long low clouds
  glow(R,800,hz+16,760,[255,216,150],.5,2.2);
  glow(R,800,hz+16,300,[255,242,206],.55,1.7);
  [[540,660,250],[1040,716,300],[150,790,200],[1480,648,230],[800,572,210]].forEach(([x,y,w])=>cloud(R,x,y,w));
  masts.forEach(([x,h],mi)=>{
    glow(R,x,hz-h,360,mi?[190,150,235]:[130,170,240],.22);
    for(let i=0;i<14;i++){
      const r=50+i*54,col=ramp([[0,[66,124,214]],[.5,[124,90,196]],[1,[214,84,160]]],i/13);
      wobbleRing(R,x,hz-h,r,r,i*.9+mi,col,2.4,.84-i*.04,Math.PI,TAU,CL,FD);

  restless(20,20,1560,880,RR=>{for(const [x,h] of masts){const r=rd(RR,90,520);wobbleRing(RR,x,hz-h,r,r,rd(RR,0,7),pk(RR,[[66,124,214],[124,90,196],[214,84,160]]),2,.6,Math.PI,TAU,CL,FD)}});
  // the horizon, with a few houses and trees on it

  for(let k=0;k<16;k++){const x=rd(R,20,1580),b=hblob(R,x,hz-14,rd(R,9,16),rd(R,12,20));fillPoly(b,[110,150,84],.7);sk(R,[[x,hz],[x,hz-8]],{col:INK,w:1.4,a:.7,amp:.2})}

  grassHatch(R,hz+6,1200,260,keep);
  meadowBlades(R,hz+8,1190,560,10,62,keep,{kf:y=>.3+.7*(y-hz)/(1200-hz)});
  tinyFlowers(R,30,hz+30,1180,3,7,keep);
  say(R,'mensen voegen kunstmatige velden toe aan het milieu',true,false);
  spine(R,10,0,1230);
  motes(R,10,1000,1300,30,70);
  whispers(R,200,860,false,2);
});

// P11 · the flower and the bee -------------------------------------------------------------------
// the field ends in the grass: a flower, and a bee that finds it
P.push(function(){
  const R=stream(SEED*101+6);
  const fx=560,fy=540,fs=92,bx=1010,by=450;
  const keepT=(x,y)=>x>960&&y>1066;
  const kf=y=>1+2*(y+40)/1100;
  // the grass behind: the field goes on
  grassHatch(R,-20,1130,420,keepT);
  meadowBlades(R,-30,1000,560,10,64,keepT,{kf});
  tinyFlowers(R,34,40,1040,5,12,(x,y)=>keepT(x,y)||Math.hypot(x-fx,y-fy)<190||Math.hypot(x-bx,y-by)<120);
  // soft washes of colour behind the rings, like a halo that has not been decided yet
  [[-90,-40,[240,140,170],.2],[70,80,[246,196,100],.2],[-10,-150,[110,190,190],.16],[120,-70,[200,150,220],.14]].forEach(([dx,dy,c,a])=>glow(R,fx+dx,fy+dy,330,c,a));
  // the flower's own field
  for(let i=0;i<11;i++){
    const r=fs*1.6+i*31,col=ramp([[0,[226,84,140]],[.5,[236,160,50]],[1,[52,150,160]]],i/10);

  // pollen, drifting between them
  {
    const pl=[];
    for(let i=0;i<48;i++){const t=R(),x=fx+120+(bx-fx-200)*t+rd(R,-60,60),y=fy-30+(by-fy+30)*t+rd(R,-90,90);pl.push([x,y,rd(R,.8,2.3),rd(R,.35,.85),pk(R,[[240,184,60],[232,120,150],[250,214,120]])])}

  tinyFlowers(R,6,980,1120,7,13,keepT);

  spine(R,11,0,392);
  whispers(R,160,1000,false,2);

  grassHatch(R,1140,1330,70,(x,y)=>Math.abs(x-800)<430&&y>1280);

});

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
history.scrollRestoration='manual';
if(!qs.has('y'))scrollTo(0,0);
let pi=0;
function genStep(){
  const t0=performance.now();
  while(pi<P.length&&performance.now()-t0<24){GEN_DY=pi*PH;P[pi]();GEN_DY=0;pi++}
  if(pi<P.length)setTimeout(genStep,0);
  else{
    GENDONE=true;
    if(qs.has('y'))scrollTo(0,(+qs.get('y'))*CSSK);
  }
}
genStep();
requestAnimationFrame(tick);
</script>
