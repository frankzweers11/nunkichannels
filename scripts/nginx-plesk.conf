# Plak dit in Plesk: Websites & Domains > nunkichannels.nl > Apache & nginx Settings
# > "Additional nginx directives". HTTPS-redirect ("Permanent SEO-safe 301 redirect
# from HTTP to HTTPS") en de www -> kale-domeinredirect stel je in Plesk zelf in
# (Hosting & DNS > Hosting Settings), niet hier.

# ---- compressie (html, css, js, json, svg, xml) ----
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/json
           application/javascript text/javascript image/svg+xml application/ld+json;

# ---- veilige basisheaders ----
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---- cache ----
# Afbeeldingen (og/thumbs): de thumbs worden met ?v=<hash> aangeroepen, og-plaatjes niet,
# dus een middenweg: een week, en de browser mag daarna hervalideren.
location ^~ /images/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
}

# Icoontjes veranderen zelden.
location ~ ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

# Sitemap en robots: kort cachen zodat Google altijd een verse kopie krijgt.
location ~ ^/(sitemap\.xml|robots\.txt)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# De gedeelde navigatie: altijd hervalideren (nginx stuurt dan een 304 als het bestand niet is veranderd).
location ~ ^/(nav\.js|nav\.css|pages\.json)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# HTML (de wanden zelf): altijd hervalideren, zodat een deploy direct zichtbaar is.
location ~ /$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
