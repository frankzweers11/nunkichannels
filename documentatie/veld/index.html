<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>veld</title>
<style>
  html,body{margin:0;padding:0;background:#12141f}
  html{scrollbar-width:none}
  ::-webkit-scrollbar{display:none;width:0;height:0}
  body{overflow-x:hidden}
  #wall{position:relative;width:100vw}
  #wall canvas{position:absolute;left:0;width:100%;display:block}
  #trail{position:fixed;left:0;top:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="wall"></div>
<canvas id="trail"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// veld — a wall about the fields we cannot see.
// one tall sheet of drawings about magnets, light, birds, bees, hearts and
// masts. every mark is laid down by a wandering hand while you watch;
// nothing here is ruled. a solid line is something measured, a broken line
// something suspected, a small spiral a question that is still open. the
// engine (tiles, queued strokes, torn paper, pencil lettering) follows the
// technique of the fable wall that inspired it.
// ---------------------------------------------------------------------------
const TAU = Math.PI*2;
const qs = new URLSearchParams(location.search);
const SEED = +(qs.get('s')||7);
const FAST = qs.has('fast');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------- rng ----------------
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function stream(n){const f=mul32((n*2654435761)>>>0);for(let i=0;i<9;i++)f();return f}
const rd=(R,a,b)=>a+R()*(b-a);
const ri=(R,a,b)=>Math.floor(rd(R,a,b+1));
const ch_=(R,p)=>R()<p;
const pk=(R,arr)=>arr[(R()*arr.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ---------------- noise ----------------
function h2(x,y,s){const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return h2(xi,yi,s)*(1-u)*(1-v)+h2(xi+1,yi,s)*u*(1-v)+h2(xi,yi+1,s)*(1-u)*v+h2(xi+1,yi+1,s)*u*v}
function fbm(x,y,s,o){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=vn(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2.03}return t/n}

// ---------------- colour ----------------
const CREAM=[246,241,228], BLUSH=[237,220,208], SAGEP=[223,226,206],
      PLUMD=[47,42,36], INDIGO=[34,32,29], VOID=[24,20,17];
const INK=[42,37,31], CINK=[238,231,210], CLAY=[172,80,54], OCHRE=[176,132,50],
      GOLD=[214,178,108], SAGE=[104,126,86], SLATE=[88,112,148], ROSE=[196,130,122],
      PLUM=[152,126,98], TEAL=[92,134,130], STEEL=[136,144,156];
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const shade=(c,k)=>[c[0]*(1-k),c[1]*(1-k),c[2]*(1-k)];
const tint=(c,k)=>[c[0]+(255-c[0])*k,c[1]+(255-c[1])*k,c[2]+(255-c[2])*k];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
let CUR=INK;

// ---------------- the wall ----------------
const LW=1600, TILEH=1200, TOTALH=13200;
const NT=Math.ceil(TOTALH/TILEH);
let S=Math.min(1.35, Math.max(1, window.devicePixelRatio||1));
if(navigator.deviceMemory && navigator.deviceMemory<8) S=1.1;
const wallEl=document.getElementById('wall');
wallEl.style.height=(TOTALH/LW*100)+'vw';
const TILES=[];
for(let i=0;i<NT;i++){
  const y0=i*TILEH, h=Math.min(TILEH+2, TOTALH-y0);
  const cv=document.createElement('canvas');
  cv.width=Math.round(LW*S); cv.height=Math.round(h*S);
  cv.style.top=(y0/LW*100)+'vw';
  cv.style.height=(h/LW*100)+'vw';
  wallEl.appendChild(cv);
  const cx=cv.getContext('2d');
  cx.lineCap='round'; cx.lineJoin='round';
  TILES.push({cv,cx,y0,h,q:[],qi:0,done:false,active:i===0});
}
let GENDONE=false;
// route one drawing act to every tile it touches; whole passages of the wall
// can be shifted down as one piece by GEN_DY
let DIRECT=null, GEN_DY=0;
function emit(y0,y1,fn){
  if(DIRECT){
    DIRECT.cx.setTransform(S,0,0,S,0,-DIRECT.y0*S);
    if(GEN_DY){DIRECT.cx.save();DIRECT.cx.translate(0,GEN_DY);fn(DIRECT.cx);DIRECT.cx.restore()}
    else fn(DIRECT.cx);
    return;
  }
  const dy=GEN_DY;
  const f=dy?cx=>{cx.save();cx.translate(0,dy);fn(cx);cx.restore()}:fn;
  const a=clamp(Math.floor((y0+dy-60)/TILEH),0,NT-1), b=clamp(Math.floor((y1+dy+60)/TILEH),0,NT-1);
  for(let i=a;i<=b;i++) TILES[i].q.push(f);
}

// ---------------- geometry ----------------
function resample(pts,step){
  if(pts.length<2)return pts.slice();
  const out=[[pts[0][0],pts[0][1]]];let need=step;
  for(let i=1;i<pts.length;i++){
    let x0=pts[i-1][0],y0=pts[i-1][1];
    const x1=pts[i][0],y1=pts[i][1];
    let d=Math.hypot(x1-x0,y1-y0);
    while(d>=need&&d>0){const t=need/d;x0+=(x1-x0)*t;y0+=(y1-y0)*t;out.push([x0,y0]);d=Math.hypot(x1-x0,y1-y0);need=step}
    need-=d;
  }
  const last=pts[pts.length-1],le=out[out.length-1];
  if(Math.hypot(last[0]-le[0],last[1]-le[1])>step*.2||out.length<2)out.push([last[0],last[1]]);
  return out;
}
function chaikin(pts,closed,it){
  while(it-->0){
    const out=[],n=pts.length;
    if(n<3)return pts;
    if(!closed)out.push(pts[0]);
    const end=closed?n:n-1;
    for(let i=0;i<end;i++){
      const a=pts[i],b=pts[(i+1)%n];
      out.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);
    }
    if(!closed)out.push(pts[n-1]);
    pts=out;
  }
  return pts;
}
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
  return[x0,y0,x1,y1]}
function blob(R,cx,cy,rx,ry){
  const rot=rd(R,0,TAU),ph=rd(R,0,7),n=14,pts=[];
  for(let i=0;i<n;i++){
    const t=i/n*TAU;
    const m=1+.16*Math.sin(t*2+ph)+.09*Math.sin(t*5+ph*2.1);
    const x=Math.cos(t)*rx*m,y=Math.sin(t)*ry*m;
    pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);
  }
  return chaikin(pts,true,1);
}
function rotPts(pts,cx,cy,rot){
  const co=Math.cos(rot),sn=Math.sin(rot);
  return pts.map(p=>[cx+(p[0]-cx)*co-(p[1]-cy)*sn, cy+(p[0]-cx)*sn+(p[1]-cy)*co]);
}
function spiralPts(cx,cy,rOut,rIn,turns,ph,dir=1){
  const n=Math.max(24,Math.round(turns*30)),pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n,th=ph+dir*t*turns*TAU,r=rOut+(rIn-rOut)*t;
    pts.push([cx+Math.cos(th)*r,cy+Math.sin(th)*r]);
  }
  return pts;
}

// ---------------- the hand ----------------
// every mark wanders off its intended path a little. pressed marks get a
// second pass, the way a pen goes back over a line it means.
function wob(R,rs,amp){
  const n=rs.length,q=[];
  const P1=rd(R,0,7),P2=rd(R,0,7),P3=rd(R,0,7);
  const F1=rd(R,1.6,3.2),F2=rd(R,5,9);
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const A=rs[Math.max(0,i-1)],B=rs[Math.min(n-1,i+1)];
    let nx=-(B[1]-A[1]),ny=B[0]-A[0];
    const d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;
    const off=amp*(.62*Math.sin(t*F1*2+P1)+.28*Math.sin(t*F2+P2)+.10*Math.sin(t*17+P3));
    q.push([rs[i][0]+nx*off+rd(R,-.3,.3),rs[i][1]+ny*off+rd(R,-.3,.3)]);
  }
  return q;
}
function sk(R,pts,o={}){
  const w=o.w??1.3, a0=o.a??.7;
  const rs=resample(pts,Math.max(2.4,w*1.5));
  const n=rs.length;
  if(n<2)return;
  const col=(o.col||CUR).slice();
  const passes=o.passes??1;
  const [bx0,by0,bx1,by1]=bbox(rs);
  for(let p=0;p<passes;p++){
    const amp=(o.amp??(w*.38+.55))*(p?1.5:1);
    const alpha=a0*(p?.35:1);
    const q=wob(R,rs,amp);
    if(o.taper){
      const segs=[];
      for(let i=1;i<n;i++){
        const t=i/(n-1);
        let e;
        if(o.taper==='out')e=.3+.7*(1-t);
        else if(o.taper==='in')e=.3+.7*t;
        else e=.35+.65*Math.min(1,Math.min(t,1-t)/.25);
        segs.push([q[i-1],q[i],rgba(col,alpha*rd(R,.8,1)),Math.max(.5,w*e*rd(R,.85,1.15))]);
      }
      emit(by0,by1,cx=>{
        cx.lineCap='round';
        for(const s of segs){
          cx.strokeStyle=s[2];cx.lineWidth=s[3];
          cx.beginPath();cx.moveTo(s[0][0],s[0][1]);cx.lineTo(s[1][0],s[1][1]);cx.stroke();
        }
      });
    } else {
      const lifts=[];
      for(let i=0;i<n;i++)lifts.push(o.gap?ch_(R,o.gap):false);
      const st=rgba(col,alpha), lw=w*rd(R,.85,1.12);
      emit(by0,by1,cx=>{
        cx.lineCap='round';cx.lineJoin='round';
        cx.beginPath();
        let lift=false;
        for(let i=0;i<n;i++){
          if(!i||lift)cx.moveTo(q[i][0],q[i][1]);else cx.lineTo(q[i][0],q[i][1]);
          lift=lifts[i];
        }
        cx.strokeStyle=st;cx.lineWidth=lw;cx.stroke();
      });
    }
    if(p===0&&w>=1.9&&!o.noDust){
      const specks=[];
      for(let i=0;i<n;i+=3){
        if(ch_(R,.6))continue;
        const sz=rd(R,.6,1.2);
        specks.push([q[i][0]+rd(R,-w,w)-sz/2,q[i][1]+rd(R,-w,w)-sz/2,sz,rgba(col,a0*rd(R,.14,.3))]);
      }
      if(specks.length)emit(by0,by1,cx=>{for(const s of specks){cx.fillStyle=s[3];cx.fillRect(s[0],s[1],s[2],s[2])}});
    }
  }
}
// a stroke that dies away toward x1 — for things i only half-hold
function fadeStroke(R,pts,o,x0,x1){
  const rs=resample(pts,4);
  let run=[],runA=1;
  const span=x1-x0;
  const flush=()=>{if(run.length>1)sk(R,run,{...o,a:(o.a??.6)*runA});run=[]};
  for(const p of rs){
    const m=clamp((x1-p[0])/span,0,1);
    if(m<.06){flush();continue}
    if(run.length===0)runA=m;
    run.push(p);
    if(Math.abs(m-runA)>.22){flush();run=[p];runA=m}
  }
  flush();
}
function dotF(R,x,y,r,a,col){
  const c=(col||CUR).slice(),pts=[];
  const n=8,ph=rd(R,0,7);
  for(let i=0;i<=n;i++){
    const t=i/n*TAU,m=1+.2*Math.sin(t*2+ph);
    pts.push([x+Math.cos(t)*r*m+rd(R,-.2,.2),y+Math.sin(t)*r*m+rd(R,-.2,.2)]);
  }
  emit(y-r-2,y+r+2,cx=>{
    cx.beginPath();
    for(let i=0;i<pts.length;i++){i?cx.lineTo(pts[i][0],pts[i][1]):cx.moveTo(pts[i][0],pts[i][1])}
    cx.closePath();cx.fillStyle=rgba(c,a);cx.fill();
  });
}
function ell(R,cx,cy,rx,ry,o={}){
  const n=Math.max(10,Math.round((rx+ry)/2)),rot=rd(R,0,TAU),pts=[];
  for(let i=0;i<n;i++){
    const t=i/n*TAU;
    const x=Math.cos(t)*rx,y=Math.sin(t)*ry;
    pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);
  }
  pts.push(pts[0]);
  sk(R,pts,o);
}
function fillPoly(pts,col,a){
  const [x0,y0,x1,y1]=bbox(pts);
  const st=rgba(col,a),P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}
    cx.closePath();cx.fillStyle=st;cx.fill();
  });
}
// scribble a region full, clipped, in one act
function scribFill(R,pts,sp,a,o={}){
  const [x0,y0,x1,y1]=bbox(pts);
  const col=(o.col||CUR).slice(), w=o.w??1;
  const lines=[],slope=rd(R,-.2,.2);
  for(let y=y0-sp;y<y1+sp;y+=sp*rd(R,.8,1.2)){
    const raw=[],ph=rd(R,0,7);
    for(let x=x0;x<=x1;x+=4)raw.push([x,y+(x-x0)*slope+Math.sin(x*.5+ph)*sp*.42+rd(R,-.8,.8)]);
    if(raw.length>1)lines.push([wob(R,resample(raw,3.2),.55),rgba(col,a*rd(R,.6,1.05)),w*rd(R,.85,1.12)]);
  }
  const P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.save();
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}
    cx.closePath();cx.clip();
    cx.lineCap='round';
    for(const L of lines){
      cx.strokeStyle=L[1];cx.lineWidth=L[2];
      cx.beginPath();
      const q=L[0];
      cx.moveTo(q[0][0],q[0][1]);
      for(let i=1;i<q.length;i++)cx.lineTo(q[i][0],q[i][1]);
      cx.stroke();
    }
    cx.restore();
  });
}
function hatchFill(R,pts,sp,ang,a,o={}){
  const [x0,y0,x1,y1]=bbox(pts);
  const col=(o.col||CUR).slice(), w=o.w??1.1, straight=o.straight;
  const diag=Math.hypot(x1-x0,y1-y0),cx0=(x0+x1)/2,cy0=(y0+y1)/2;
  const px=Math.cos(ang+Math.PI/2),py=Math.sin(ang+Math.PI/2);
  const dx=Math.cos(ang),dy=Math.sin(ang);
  const lines=[],n=Math.ceil(diag/sp);
  for(let i=-n;i<=n;i++){
    const t=i*sp+(straight?0:rd(R,-.2,.2)*sp);
    const raw=[[cx0+px*t-dx*diag*.6,cy0+py*t-dy*diag*.6],[cx0+px*t+dx*diag*.6,cy0+py*t+dy*diag*.6]];
    lines.push([straight?raw:wob(R,resample(raw,4),.7),rgba(col,a*(straight?1:rd(R,.6,1.1))),w*(straight?1:rd(R,.85,1.15))]);
  }
  const P=pts.map(p=>p.slice());
  emit(y0,y1,cx=>{
    cx.save();
    cx.beginPath();
    for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}
    cx.closePath();cx.clip();
    cx.lineCap=straight?'butt':'round';
    for(const L of lines){
      cx.strokeStyle=L[1];cx.lineWidth=L[2];
      cx.beginPath();
      const q=L[0];
      cx.moveTo(q[0][0],q[0][1]);
      for(let i=1;i<q.length;i++)cx.lineTo(q[i][0],q[i][1]);
      cx.stroke();
    }
    cx.restore();
  });
}
// a soft coloured-pencil scrub, never quite inside the lines
function scrub(R,cx,cy,r,col,a=.4){
  const b=blob(R,cx,cy,r*rd(R,1,1.12),r*rd(R,.82,1));
  fillPoly(b,col,.1);
  scribFill(R,b,Math.max(3,r*.13),a,{col});
}
function spatter(R,x,y,r,n,col,a=.5){
  const sd=ri(R,0,99999),c=col.slice();
  emit(y-r,y+r,cx=>{
    const RR=mul32(sd);
    for(let i=0;i<n;i++){
      const t=RR()*TAU,d=Math.sqrt(RR())*r;
      const s=.8+RR()*RR()*2.2;
      cx.fillStyle=rgba(c,a*(.3+RR()*.7));
      cx.fillRect(x+Math.cos(t)*d,y+Math.sin(t)*d*.7,s,s*(.8+RR()*.5));
    }
  });
}
function drip(R,x,y,len,col,a=.3,w=2){
  const pts=[[x,y]];
  let px=x;
  for(let d=0;d<len;d+=9){px+=rd(R,-1.4,1.4);pts.push([px,y+d])}
  sk(R,pts,{col,w,a,taper:'out',amp:.4});
  dotF(R,px,y+len,w*1.1,a*1.2,col);
}
function arrowHead(R,x,y,ang,sz,a,col,w=1.6){
  for(const sd of[-1,1])
    sk(R,[[x,y],[x-Math.cos(ang+sd*.5)*sz,y-Math.sin(ang+sd*.5)*sz]],{col,w,a,taper:'out'});
}
function zigOut(R,x,y,rx,ry){
  const pts=[];
  const n=ri(R,6,9);
  for(let i=0;i<=n;i++)pts.push([x+(i/n*2-1)*rx+rd(R,-4,4),y+((i%2)?-1:1)*ry*rd(R,.5,1)]);
  sk(R,pts,{w:1.4,a:.55,amp:1});
}
function spark(R,x,y,r,o={}){
  const n=o.nR??ri(R,5,8);
  const rot=rd(R,0,TAU),col=o.col||CUR;
  for(let i=0;i<n;i++){
    const a=rot+i/n*TAU+rd(R,-.14,.14)/n*TAU;
    const r0=r*rd(R,.22,.34),r1=r*rd(R,.85,1.1)*(i%2?.78:1);
    sk(R,[[x+Math.cos(a)*r0,y+Math.sin(a)*r0],[x+Math.cos(a)*r1,y+Math.sin(a)*r1]],
      {col,w:o.w??1.3,a:(o.a??.75)*rd(R,.8,1),taper:'out',amp:.3});
  }
  if(!o.noCenter&&ch_(R,.55))dotF(R,x,y,Math.max(1,r*.13),(o.a??.75),col);
}

// ---------------- asemic writing ----------------
// a few drawings need writing that only looks like writing: a lab notebook nobody can read.
function aword(R,x,y,h,nl,o={}){
  const pts=[[x,y+rd(R,-.1,.1)*h]];
  let cx=x;
  for(let i=0;i<nl;i++){
    const up=y-h*rd(R,.32,.62)-(ch_(R,.13)?h*rd(R,.4,.75):0);
    const dn=y+(ch_(R,.09)?h*rd(R,.3,.55):h*rd(R,-.06,.12));
    cx+=h*rd(R,.18,.3);pts.push([cx,up]);
    cx+=h*rd(R,.18,.3);pts.push([cx,dn]);
  }
  sk(R,chaikin(pts,false,1),{col:o.col,w:o.w??.9,a:o.a??.55,amp:.28});
  return cx-x;
}
function atext(R,xa,xb,y,h,o={}){
  let cx=xa,guard=0;
  while(cx<xb-h*.9&&guard++<70){
    let nl=ri(R,2,5);
    const est=nl*h*.5;
    if(cx+est>xb)nl=Math.max(1,Math.floor((xb-cx)/(h*.5)));
    if(nl<1)break;
    const adv=aword(R,cx,y,h,nl,o);
    cx+=adv+h*rd(R,.45,.75);
  }
}

// ---------------- hand lettering ----------------
// a real alphabet, one wobbly stroke at a time. used rarely, like pencil notes.
const A_=(cx,cy,rx,ry,a0,a1,n=9)=>{const p=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;p.push([cx+Math.cos(t)*rx,cy+Math.sin(t)*ry])}return p};
const GL={};
const G=(chr,w,...strokes)=>GL[chr]={w,s:strokes};
G('a',.62,A_(.27,.73,.23,.26,-.5,5.8),[[.5,.48],[.52,.96],[.6,1]]);
G('b',.6,[[.1,.05],[.1,1]],[[.1,.56],[.34,.47],[.54,.62],[.53,.86],[.3,1],[.1,.9]]);
G('c',.58,A_(.3,.74,.25,.26,.6,5.68));
G('d',.62,A_(.28,.74,.24,.26,-.5,5.8),[[.52,.05],[.53,.95],[.6,1]]);
G('e',.56,[[.08,.73],[.48,.7],[.49,.54],[.3,.45],[.1,.56],[.07,.8],[.26,1],[.5,.93]]);

// ---------------- torn paper ----------------
// the wall is a collage: sheets of coloured paper glued down, edges torn by
// hand, each showing its white fibrous core where it ripped.
function tornPath(R,x0,y0,x1,y1,rough,sd){
  const pts=[];
  const side=(ax,ay,bx,by,nx,ny,id)=>{
    const L=Math.hypot(bx-ax,by-ay),steps=Math.max(3,Math.round(L/26));
    for(let i=0;i<steps;i++){
      const t=i/steps;
      let off=(fbm(t*3.1+id*7,id*3.3,sd,3)-.5)*2*rough;
      if(h2(i*1.7,id*9.1,sd)>0.93)off+=rd(R,8,22)*(h2(i,id,sd+3)>.5?1:-1);
      pts.push([ax+(bx-ax)*t+nx*off,ay+(by-ay)*t+ny*off]);
    }
  };
  side(x0,y0,x1,y0,0,1,0);
  side(x1,y0,x1,y1,-1,0,1);
  side(x1,y1,x0,y1,0,-1,2);
  side(x0,y1,x0,y0,1,0,3);
  return pts;
}
function sheet(R,x0,y0,x1,y1,col,o={}){
  const rough=o.rough??16;
  const sd=ri(R,0,9999);
  let P=tornPath(R,x0,y0,x1,y1,rough,sd);
  if(o.rot)P=rotPts(P,(x0+x1)/2,(y0+y1)/2,o.rot);
  // the shadow the paper casts on what is beneath it
  fillPoly(P.map(p=>[p[0]+6,p[1]+8]),[12,9,7],.28);
  fillPoly(P,col,1);
  fillPoly(P,col,1);
  const [bx0,by0,bx1,by1]=bbox(P);
  const PP=P.map(p=>p.slice());
  // grain: the tooth of the paper
  const gsd=ri(R,0,99999);
  emit(by0,by1,cx=>{
    const RR=mul32(gsd);
    cx.save();
    cx.beginPath();
    for(let i=0;i<PP.length;i++){i?cx.lineTo(PP[i][0],PP[i][1]):cx.moveTo(PP[i][0],PP[i][1])}
    cx.closePath();cx.clip();
    const n=Math.round((bx1-bx0)*(by1-by0)/1900);
    for(let i=0;i<n;i++){
      const s=.8+RR()*1.1;
      const dark=RR()<.62;
      cx.fillStyle=dark?'rgba(45,40,34,.05)':'rgba(255,252,244,.07)';
      cx.fillRect(bx0+RR()*(bx1-bx0),by0+RR()*(by1-by0),s,s);
    }
    for(let i=0;i<n/22;i++){
      const fx=bx0+RR()*(bx1-bx0),fy=by0+RR()*(by1-by0),fa=RR()*TAU,fl=3+RR()*7;
      cx.strokeStyle='rgba(45,40,34,.05)';cx.lineWidth=.7;
      cx.beginPath();cx.moveTo(fx,fy);cx.lineTo(fx+Math.cos(fa)*fl,fy+Math.sin(fa)*fl);cx.stroke();
    }
    cx.restore();
  });
  // torn edge: the white fibrous core
  if(!o.noCore){
    const core=P.concat([P[0]]);
    sk(R,core,{col:[251,247,237],w:2,a:.42,amp:.4,gap:.24,noDust:true});
    sk(R,core.map(p=>[p[0]+rd(R,1,3),p[1]+rd(R,1,3)]),{col:shade(col,.22),w:1,a:.2,amp:.5,gap:.4,noDust:true});
  }
  return P;
}
// a little pinned study: torn scrap + shadow + tape at two corners
function scrap(R,x,y,w,h,col,rot){
  const P=sheet(R,x-w/2,y-h/2,x+w/2,y+h/2,col,{rough:8,rot});
  const [bx0,by0,bx1,by1]=bbox(P);
  for(const cnr of[[bx0+14,by0+12],[bx1-16,by1-12]]){
    const tp=rotPts([[cnr[0]-22,cnr[1]-8],[cnr[0]+22,cnr[1]-8],[cnr[0]+22,cnr[1]+9],[cnr[0]-22,cnr[1]+9]],cnr[0],cnr[1],rd(R,.5,.9));
    fillPoly(tp,[240,234,216],.35);
    sk(R,tp.concat([tp[0]]),{col:[184,174,154],w:.8,a:.25,amp:.3,noDust:true});
  }
}

function enso(R,cx,cy,r,frac,col,o={}){
  const a0=rd(R,0,TAU),pts=[];
  const n=Math.round(40*frac);
  for(let i=0;i<=n;i++){
    const t=a0+i/n*TAU*frac;
    const rr2=r*(1+.03*Math.sin(i*.7));
    pts.push([cx+Math.cos(t)*rr2,cy+Math.sin(t)*rr2]);
  }
  sk(R,pts,{col,w:o.w??9,a:o.a??.75,amp:3,taper:'out',noDust:true});
  sk(R,pts.map(p=>[p[0]+rd(R,2,5),p[1]+rd(R,2,4)]),{col,w:(o.w??9)*.4,a:(o.a??.75)*.3,amp:3.4,gap:.12,noDust:true});
  return a0+TAU*frac; // where the brush lifted
}
function moth(R,x,y,s,col,a=.6){

    sk(R,wing.concat([wing[0]]),{col,w:1.1,a,amp:.5});
    scribFill(R,wing,s*.3,a*.4,{col});

    sk(R,[[x,y-s*.42],[x+sd*s*.3,y-s*.75]],{col,w:.9,a:a*.8,amp:.3,taper:'out'});
}
function shellSpiral(R,cx,cy,r,col){
  const pts=[];
  for(let t=0;t<=1;t+=.012){
    const th=t*3.2*TAU, rr2=r*Math.pow(.78,3.2*2-t*3.2*2);
    pts.push([cx+Math.cos(th)*rr2,cy+Math.sin(th)*rr2*.86]);
  }
  sk(R,pts,{col,w:1.6,a:.6,amp:.7});
  for(let k=0;k<7;k++){
    const t=.4+k*.09,th=t*3.2*TAU,rr2=r*Math.pow(.78,3.2*2-t*3.2*2);
    sk(R,[[cx+Math.cos(th)*rr2*.55,cy+Math.sin(th)*rr2*.5],[cx+Math.cos(th)*rr2,cy+Math.sin(th)*rr2*.86]],{col,w:.9,a:.35,amp:.3});
  }
}
function fern(R,x,y,h,col){
  const spine=[];
  for(let t=0;t<=1;t+=.07)spine.push([x+Math.sin(t*2.6)*h*.14,y-t*h]);
  sk(R,spine,{col,w:1.5,a:.6,amp:.5,taper:'out'});
  for(let t=.08;t<.95;t+=.06){
    const i=Math.min(spine.length-1,Math.round(t*spine.length));
    const p=spine[i],L=h*.16*(1-t*.8);
    for(const sd of[-1,1]){
      const tip=[p[0]+sd*L,p[1]-L*.5];
      sk(R,[p,tip],{col,w:1,a:.5,amp:.4,taper:'out'});
    }
  }
}

// ---------------- replay engine ----------------
let CSSK=innerWidth/LW;
addEventListener('resize',()=>{CSSK=innerWidth/LW;sizeTrail()});
function tick(now){
  const sy=scrollY/CSSK, vh=innerHeight/CSSK;
  for(const T of TILES) if(!T.active && T.y0 < sy+vh*1.8) T.active=true;
  const budget=(FAST||RM)?200:7;
  const t0=performance.now();
  for(const T of TILES){
    if(!T.active||T.done)continue;
    T.cx.setTransform(S,0,0,S,0,-T.y0*S);
    while(T.qi<T.q.length){
      T.q[T.qi++](T.cx);
      if(performance.now()-t0>budget)break;
    }
    if(GENDONE&&T.qi>=T.q.length){T.done=true;T.q=null;readyRestless(T)}
    if(performance.now()-t0>budget)break;
  }
  runRestless(now);
  drawTrail(now);
  requestAnimationFrame(tick);
}

// ---------------- restlessness ----------------
// a few marks cannot hold still. every so often one erases itself and is
// drawn again, never quite the same, like a field line that is only drawn once it is felt.
const RESTLESS=[];
function restless(x,y,w,h,fn){RESTLESS.push({x,y:y+GEN_DY,w,h,fn,dy:GEN_DY,img:null,next:0,tile:null})}
function readyRestless(T){
  if(RM)return;
  for(const r of RESTLESS){
    if(r.img)continue;
    if(r.y>=T.y0&&r.y+r.h<=T.y0+T.h&&T.done){
      r.tile=T;
      const px=Math.round(r.x*S),py=Math.round((r.y-T.y0)*S);
      const pw=Math.round(r.w*S),ph=Math.round(r.h*S);
      try{r.img=T.cx.getImageData(px,py,pw,ph);r.px=px;r.py=py;
          r.next=performance.now()+2000+Math.random()*3000;}catch(e){}
    }
  }
}
let restR=stream(SEED*77+3);
function runRestless(now){
  for(const r of RESTLESS){
    if(!r.img||now<r.next)continue;
    r.tile.cx.putImageData(r.img,r.px,r.py);
    DIRECT=r.tile; GEN_DY=r.dy;
    r.fn(restR);
    GEN_DY=0; DIRECT=null;
    r.next=now+2600+Math.random()*4200;
  }
}

// ---------------- the visitor ----------------
// where you move, you leave graphite on the wall. it fades, like iron
// filings that fall back when the magnet moves on.
const trailCv=document.getElementById('trail');
const trailCx=trailCv.getContext('2d');
let TP=[];
function sizeTrail(){
  const d=Math.min(2,devicePixelRatio||1);
  trailCv.width=innerWidth*d;trailCv.height=innerHeight*d;
  trailCv.style.width=innerWidth+'px';trailCv.style.height=innerHeight+'px';
  trailCx.setTransform(d,0,0,d,0,0);
  trailCx.lineCap='round';
}
sizeTrail();
addEventListener('pointermove',e=>{
  const t=performance.now();
  const L=TP[TP.length-1];
  if(L&&Math.hypot(e.clientX-L.x,e.clientY-L.y)<3)return;
  TP.push({x:e.clientX,y:e.clientY,t});
  if(TP.length>400)TP.shift();
},{passive:true});
const DARKP=new Set([1,2,3,5,7,10]);
function drawTrail(now){
  if(RM){trailCx.clearRect(0,0,innerWidth,innerHeight);return}
  trailCx.clearRect(0,0,innerWidth,innerHeight);
  if(TP.length<2)return;
  const pidx=Math.floor((scrollY+innerHeight/2)/CSSK/TILEH);
  const col=DARKP.has(pidx)?CINK:INK;
  const LIFE=3800;
  while(TP.length&&now-TP[0].t>LIFE)TP.shift();
  for(let i=1;i<TP.length;i++){
    const a=TP[i-1],b=TP[i];
    if(b.t-a.t>110)continue;
    const age=(now-b.t)/LIFE;
    const k=1-age;
    if(k<=0)continue;
    const wobx=Math.sin(now*.0011+i*.7)*1.3*age, woby=Math.cos(now*.0009+i*1.1)*1.3*age;
    trailCx.strokeStyle=rgba(col,.2*k*k);
    trailCx.lineWidth=.8+1.6*k;
    trailCx.beginPath();
    trailCx.moveTo(a.x+wobx,a.y+woby);
    trailCx.lineTo(b.x+wobx,b.y+woby);
    trailCx.stroke();
  }
}

function whispers(R,y0,y1,dark,n){
  const col=dark?CINK:INK;
  for(let i=0;i<n;i++){
    const left=ch_(R,.5);
    const x=left?rd(R,26,140):rd(R,1460,1574);
    const y=rd(R,y0+40,y1-40);
    const a=rd(R,.25,.45);
    const k=ri(R,0,6);
    if(k===0)sk(R,spiralPts(x,y,rd(R,8,16),2,rd(R,1.5,2.5),rd(R,0,7)),{col,w:1,a,amp:.4});
    else if(k===1){for(let j=0;j<ri(R,3,6);j++)dotF(R,x+j*7,y+rd(R,-2,2),1.2,a,col)}
    else if(k===2){sk(R,[[x-6,y],[x+6,y]],{col,w:1,a,amp:.3});sk(R,[[x,y-6],[x,y+6]],{col,w:1,a,amp:.3})}
    else if(k===3)spark(R,x,y,rd(R,6,11),{col,a,w:1,nR:4,noCenter:true});
    else if(k===4)aword(R,x-15,y,rd(R,8,12),ri(R,2,4),{col,a});
    else if(k===5)ell(R,x,y,rd(R,5,9),rd(R,5,9),{col,w:1,a,amp:.4});
    else birdM(R,x,y,rd(R,6,10),col,a);
  }
}

function dipLine(cx,cy,L,tilt,side,r0){

// iron filings: thousands of short dashes that lie along an invisible field.
// they are laid down from the source outward, so the field seems to spread.
function filings(R,fn,cx,cy,rx,ry,n,o={}){
  const segs=[],ref=o.ref||1;
  for(let i=0;i<n;i++){
    const t=rd(R,0,TAU),d=Math.sqrt(R());
    const x=cx+Math.cos(t)*rx*d,y=cy+Math.sin(t)*ry*d;
    if(o.skip&&o.skip(x,y))continue;
    const f=fn(x,y);
    const mag=Math.hypot(f[0],f[1]);
    if(!(mag>0))continue;
    const p=clamp(Math.pow(mag/ref,o.pw??.42),o.pmin??.1,1)*(1-d*d*d);
    if(R()>p)continue;

  }
  const ox=o.ox??cx,oy=o.oy??cy;
  segs.sort((a,b)=>Math.hypot(a[0]-ox,a[1]-oy)-Math.hypot(b[0]-ox,b[1]-oy));
  const col=(o.col||FIL).slice(),B=70;
  for(let i=0;i<segs.length;i+=B){
    const batch=segs.slice(i,i+B);
    let y0=1e9,y1=-1e9;
    for(const s of batch){if(s[1]<y0)y0=s[1];if(s[1]>y1)y1=s[1]}
    emit(y0-12,y1+12,c2=>{
      c2.lineCap='round';
      for(const s of batch){
        const c=Math.cos(s[2])*s[3]/2,sn=Math.sin(s[2])*s[3]/2;
        c2.strokeStyle=rgba(col,s[4]);c2.lineWidth=s[5];
        c2.beginPath();c2.moveTo(s[0]-c,s[1]-sn);c2.lineTo(s[0]+c,s[1]+sn);c2.stroke();
      }
    });
  }
}

const magField=(cx,cy,d)=>(x,y)=>{

  // light that does hit it: uv bends the thread, and cells mend it
  spark(R,170,330,30,{col:SUNC,a:.95,w:2.4,nR:9});
  write(R,'uv',170,400,18,{col:CINK,a:.8,cen:true});
  for(const o of[-26,0,26])sk(R,[[200+o*.2,340+o],[640,610+o*.6]],{col:SUNC,w:2.2,a:.6,amp:1,taper:'out'});
  sk(R,[[640,590],[660,602],[646,614],[666,626]],{col:VIOLET,w:2.4,a:.9,amp:.2});
  spark(R,652,606,12,{col:VIOLET,a:.9,w:1.4,nR:6});
  note(R,'m',90,740,'dna is een dubbele draad, een molecuul',18,true);
  note(R,'m',90,785,'lading kan er een stukje doorheen lopen',18,true);
  note(R,'m',90,830,['uv-licht kan de draad beschadigen,','cellen herstellen dat'],18,true);
  note(R,'v',1010,830,['dat dna ook velden en licht opvangt,','als een antenne: een idee van sommige','onderzoekers, nog niet bewezen'],18,true);
  note(R,'q',1010,960,['en wat dat zou betekenen,','als het waar bleek te zijn'],18,true);
  whispers(R,100,1100,true,3);
});

// P8 · what we add ---------------------------------------------------------------------------------
P.push(function(){
  const R=stream(SEED*101+8);
  sheet(R,50,40,1550,1192,[234,236,228],{rough:14,rot:.003});
  write(R,'wat wij er zelf aan toevoegen',800,130,42,{a:.88,cen:true});
  const hz=860,masts=[[360,420],[900,250],[1370,470]];
  // their signals, drawn first so the masts stand in front
  masts.forEach(([x,h],i)=>signalArcs(R,x,hz-h,56,780,52,60,hz-6,.62-i*.04));
  restless(620,330,560,300,RR=>{const r=rd(RR,100,280);const pts=[];for(let t=Math.PI;t<=TAU;t+=.03)pts.push([900+Math.cos(t)*r,610+Math.sin(t)*r]);sk(RR,pts,{col:ELEC,w:1.4,a:.45,amp:.8})});
  sk(R,wave0(70,1530,hz,3,.01),{w:2.6,a:.8,amp:1.4});
  masts.forEach(([x,h])=>mast(R,x,hz,h,INK));
  // roofs, trees, the small human scale
  for(let k=0;k<12;k++){
    const x=rd(R,120,1480);if(masts.some(m=>Math.abs(m[0]-x)<60))continue;
    const w=rd(R,26,46),h=rd(R,18,28);
    fillPoly([[x-w/2,hz],[x+w/2,hz],[x+w/2,hz-h],[x-w/2,hz-h]],[246,240,226],.95);
    sk(R,[[x-w/2,hz],[x-w/2,hz-h],[x,hz-h-w*.35],[x+w/2,hz-h],[x+w/2,hz]],{col:INK,w:1.4,a:.8,amp:.4});
  }
  for(let k=0;k<16;k++){const x=rd(R,100,1500),b=hblob(R,x,hz-14,rd(R,9,16),rd(R,12,20));fillPoly(b,[130,160,100],.6);sk(R,[[x,hz],[x,hz-8]],{col:INK,w:1.4,a:.7,amp:.2})}
  note(R,'m',140,950,'wat vroeger alleen zon en bliksem maakten, maken wij nu zelf',22,false);
  note(R,'m',140,998,'de signalen van masten liggen ver onder de richtlijnen',22,false);
  note(R,'m',140,1046,['bij roodborstjes bracht ruis van elektronica in steden','het kompas in de war, niet de masten zelf'],22,false);
  note(R,'v',140,1126,'dat het ook bijen en vogels raakt, vermoeden sommige onderzoekers',22,false);
  note(R,'q',140,1170,'wat een heel leven in dit veld doet, wordt nog onderzocht',22,false);
  whispers(R,160,900,false,3);
});

// P9 · the needle ---------------------------------------------------------------------------------------
P.push(function(){
  const R=stream(SEED*101+9);
  sheet(R,50,40,1550,1160,PARCH,{rough:14,rot:-.003});
  write(R,'de naald voelt wat wij niet voelen',800,135,42,{a:.88,cen:true});
  const cx=800,cy=560,cr=240;
  filings(R,(x,y)=>[Math.sin(y*.012+x*.004)*.07,-1],cx,cy,720,470,3600,{ref:1.1,pw:.2,pmin:.35,am:.6,skip:(x,y)=>Math.hypot(x-cx,y-cy)<cr+40||(y<185&&Math.abs(x-800)<560)||y>905});
  const face=circ(R,cx,cy,cr);
  fillPoly(face,[248,243,228],.97);
  sk(R,face.concat([face[0]]),{w:3.2,a:.9,amp:1});
  ell(R,cx,cy,cr*.88,cr*.88,{w:1.3,a:.6,amp:.8});
  for(let k=0;k<72;k++){
    const a=k/72*TAU,l=k%18===0?30:k%9===0?20:k%2===0?12:7,r0=cr*.88;
    sk(R,[[cx+Math.sin(a)*r0,cy-Math.cos(a)*r0],[cx+Math.sin(a)*(r0-l),cy-Math.cos(a)*(r0-l)]],{w:k%18===0?2:1.2,a:.75,amp:.2});
  }
  write(R,'n',cx,cy-cr*.55,38,{col:MAGR,a:.95,cen:true});write(R,'z',cx,cy+cr*.55+30,38,{a:.85,cen:true});
  write(R,'o',cx+cr*.62,cy+14,38,{a:.85,cen:true});write(R,'w',cx-cr*.62,cy+14,38,{a:.85,cen:true});
  needle(R,cx,cy,.05,cr*.62,.9,false);
  dotF(R,cx,cy,7,.95,INK);dotF(R,cx,cy,2.6,1,[246,242,232]);
  restless(cx-cr,cy-cr,cr*2,cr*2,RR=>needle(RR,cx,cy,rd(RR,-.4,.45),cr*.62,.3,true));
  note(R,'m',160,1010,'een kompas leest het aardveld, dat dwars door alles heen loopt',22,false);
  note(R,'v',160,1058,'misschien voelen wij het ook, heel zacht',22,false);
  note(R,'q',160,1106,'wat zou het zijn, een zintuig dat je nooit gebruikt?',22,false);
  whispers(R,160,900,false,3);
});

// P10 · standing in it ----------------------------------------------------------------------------------------
P.push(function(){
  const R=stream(SEED*101+10);
  sheet(R,40,30,1560,1192,SPACE,{rough:16});
  write(R,'je staat midden in het veld',800,135,46,{col:CINK,a:.9,cen:true});
  const hx=800,hy=470,U=1,Mg=U*Math.pow(150,3)/2;
  filings(R,(x,y)=>{
    const dx=x-hx,dy=y-hy,r2=dx*dx+dy*dy+400,r=Math.sqrt(r2),mx=0,my=-1,dm=(mx*dx+my*dy)/r;
    return [Mg*(3*dm*dx/r-mx)/(r2*r),Mg*(3*dm*dy/r-my)/(r2*r)-U];
  },hx,hy+40,680,330,5200,{col:[226,222,206],ref:1.2,pw:.3,pmin:.3,ox:hx,oy:hy,skip:(x,y)=>Math.abs(x-hx)<46&&y>hy-130&&y<hy+300||y<225||y>850});
  // a person, small, with a pulse
  const C=CINK;
  ell(R,hx,hy-118,15,16,{col:C,w:2.2,a:.9,amp:.3});
  sk(R,[[hx,hy-100],[hx,hy+10]],{col:C,w:3,a:.9,amp:.4});
  sk(R,[[hx,hy-80],[hx-28,hy-20]],{col:C,w:2.6,a:.85,amp:.3});sk(R,[[hx,hy-80],[hx+28,hy-20]],{col:C,w:2.6,a:.85,amp:.3});
  sk(R,[[hx,hy+10],[hx-22,hy+110]],{col:C,w:2.8,a:.9,amp:.4});sk(R,[[hx,hy+10],[hx+22,hy+110]],{col:C,w:2.8,a:.9,amp:.4});
  spark(R,hx+4,hy-62,16,{col:ELEC,a:.95,w:2,nR:8});
  restless(hx-34,hy-96,76,76,RR=>spark(RR,hx+4,hy-62,16+rd(RR,0,6),{col:ELEC,a:.95,w:2,nR:ri(RR,7,10)}));
  note(R,'m',140,880,'het aardveld loopt dwars door je heen',22,true);
  note(R,'m',140,926,'je eigen hart maakt er een bij',22,true);
  note(R,'m',140,972,'en elke dag komen er signalen bij die we zelf maken',22,true);
  note(R,'q',140,1018,'wat dat allemaal samen met een mens doet, is nog niet af',22,true);
  write(R,'veld · krachten in het onzichtbare · 2026',800,1120,18,{col:CINK,a:.8,cen:true});
  aword(R,690,1156,13,5,{col:CINK,a:.6});
  write(R,'(mijn echte handtekening)',830,1162,12,{col:CINK,a:.6});
  whispers(R,100,860,true,3);
});

// boot

history.scrollRestoration='manual';
if(!qs.has('y'))scrollTo(0,0);
let pi=0;
function genStep(){
  const t0=performance.now();
  while(pi<P.length&&performance.now()-t0<24){GEN_DY=pi*PH;P[pi]();GEN_DY=0;pi++}
  if(pi<P.length)setTimeout(genStep,0);
  else{
    GENDONE=true;
    if(qs.has('y'))scrollTo(0,(+qs.get('y'))*CSSK);
  }
}
genStep();
requestAnimationFrame(tick);
